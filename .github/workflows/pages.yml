name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - showcase/**
      - gemfire/**
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - showcase/**
      - gemfire/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: gemfire/.nvmrc
          cache: npm
          cache-dependency-path: |
            gemfire/package-lock.json
            showcase/package-lock.json
      - name: Install game dependencies
        run: npm ci --prefix gemfire
      - name: Install showcase dependencies
        run: npm ci --prefix showcase
      - name: Check showcase
        run: npm run check:ci --prefix showcase
      - name: Check game
        run: npm run check:ci --prefix gemfire
      - name: Test game
        run: npm test --prefix gemfire
      - name: Build showcase and game
        env:
          SHOWCASE_BASE: /${{ github.event.repository.name }}/
        run: npm run build --prefix showcase
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase/dist/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
