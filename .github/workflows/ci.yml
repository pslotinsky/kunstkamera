name: CI

on:
  push:
    branches: [main]
    paths:
      - showcase/**
      - gemstorm/**
      - debt-dungeon/**
      - total-space/**
      - kingdom-hr/**
      - .github/workflows/ci.yml
      - .github/workflows/gemstorm-ci.yml
  pull_request:
    branches: [main]
    paths:
      - showcase/**
      - gemstorm/**
      - debt-dungeon/**
      - total-space/**
      - kingdom-hr/**
      - .github/workflows/ci.yml
      - .github/workflows/gemstorm-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gemstorm:
    name: Gemstorm
    uses: ./.github/workflows/gemstorm-ci.yml

  showcase:
    name: Showcase
    needs: gemstorm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: gemstorm/.nvmrc
          cache: npm
          cache-dependency-path: |
            showcase/package-lock.json
            debt-dungeon/package-lock.json
      - name: Install showcase dependencies
        run: npm ci --prefix showcase
      - name: Install Debt Dungeon dependencies
        run: npm ci --prefix debt-dungeon
      - name: Check Debt Dungeon
        run: npm run check:ci --prefix debt-dungeon
      - name: Check showcase
        run: npm run check:ci --prefix showcase
      - name: Build showcase
        env:
          SHOWCASE_BASE: /${{ github.event.repository.name }}/
        run: npm run build --prefix showcase
      - name: Download game build
        uses: actions/download-artifact@v8
        with:
          name: gemstorm-game
          path: showcase/dist/public/gemstorm/game
      - uses: actions/upload-pages-artifact@v5
        with:
          path: showcase/dist/public

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [gemstorm, showcase]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
