/* v2 UX adjustments */
.map-help,.helpbar,.sidebar,.system-fleets{display:none!important}
.workspace{display:block}
.main{width:100%;height:100%}
.system-view{height:100%;overflow:hidden}
.space-scene{height:285px;flex:0 0 285px}
.planet-tag{font-size:12px;font-weight:700;background:#10161dcc;border:1px solid #394453;border-radius:3px;padding:4px 7px;pointer-events:none}

.system-fleet-panel .fleet-units{padding:8px 12px}
.system-fleet-panel .unit-card{height:96px;width:112px;padding:5px}
.system-fleet-panel .unit-card img{height:43px}
.system-fleet-panel .fleet-info{padding:10px 12px;width:220px}
.system-fleet-panel .fleet-heading{margin-bottom:6px}

.system-fleet-marker:hover{border-color:#c7d7e7;background:#101820aa}

.system-fleet-marker.enemy{color:#df7373}
.system-fleet-marker.ours{color:#67a9e6}
.planet-strip{height:272px;flex:0 0 272px;padding:10px 12px;gap:8px;align-items:stretch}
.planet-card{min-width:332px;max-width:332px;height:250px}
.pc-head{height:48px;padding:7px 9px}
.pc-body{padding:7px 9px;min-height:160px}
.pc-foot{height:30px;padding:6px 9px}
.building-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,64px);gap:5px}
.building-slot{height:64px;min-height:64px;position:relative}
.building-slot.locked-slot{cursor:default;opacity:.28;background:#111820}
.foreign-flag{height:128px}
.build-picker{position:absolute;left:8px;right:8px;bottom:7px;background:#131a22f7;border:1px solid #65758a;border-radius:4px;padding:7px;z-index:10;box-shadow:var(--shadow)}
.build-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.build-option{width:auto;min-width:0;padding:5px}
.build-option img{height:34px}
.build-option .tiny{white-space:nowrap}
.fleet-panel{height:182px}
.unit-card{height:108px}
.inline-pop{bottom:116px}

  .topbar{height:48px}.space-scene{height:240px;flex-basis:240px}.system-fleet-panel{height:130px;flex-basis:130px}
  .system-fleet-panel .unit-card{height:82px}.system-fleet-panel .unit-card img{height:34px}
  .planet-strip{height:245px;flex-basis:245px}.planet-card{height:224px}.pc-body{min-height:138px}
  .building-grid{grid-template-rows:repeat(2,54px)}.building-slot{height:54px;min-height:54px}.building-slot img{width:34px;height:34px}
}

.system-fleet-panel{position:relative}.system-fleet-panel .fleet-units{flex:1}.system-fleet-panel .inline-pop{bottom:8px;right:12px}.system-fleet-panel .fleet-info{display:none!important}


/* v5 responsive-width pass */
html,body,#root{width:100%;max-width:100%;overflow-x:hidden}
.app{width:100%;min-width:0;max-width:100vw;overflow:hidden}
.topbar{min-width:0;gap:clamp(8px,1.15vw,18px);padding-inline:clamp(10px,1.25vw,18px)}
.topbar>*{flex-shrink:0}.topbar .grow{flex-shrink:1}
.workspace,.main,.galaxy,.system-view{width:100%;min-width:0;max-width:100%}

/* Let fleet cards consume the available width instead of forcing it. */
.unit-row{width:100%;min-width:0;overflow:hidden}
.unit-card{flex:1 1 108px;min-width:82px;max-width:138px;width:auto}
.system-fleet-panel .unit-card{flex:1 1 96px;min-width:76px;max-width:122px;width:auto}
.fleet-heading{gap:clamp(8px,1vw,18px);flex-wrap:wrap}
.fleet-info{flex:0 0 clamp(175px,18vw,230px);width:auto}

/* Planet cards are content-sized, not stretched to fill the row.
   Major = 4x2 building grid, minor = 2x2. The strip scrolls only when
   the actual number of planets no longer fits. */
.planet-strip{
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  overflow-x:auto;
  overflow-y:hidden;
  width:100%;
  min-width:0;
}
.planet-card{
  flex:0 0 auto;
  width:auto!important;
  min-width:0!important;
  max-width:none!important;
}
.planet-card.major{width:332px!important}
.planet-card.minor{width:190px!important}
.pc-head,.pc-body,.pc-foot{min-width:0}
.pc-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.building-grid{min-width:0}
.building-slot{min-width:0;overflow:hidden}
.building-slot img{max-width:100%}

/* Overlays should never force the page wider than the viewport. */
.battle-card{width:min(680px,calc(100vw - 28px));max-width:100%}
.inline-pop{width:min(310px,calc(100vw - 28px));max-width:100%}
.event-stack{width:min(330px,calc(100vw - 28px));max-width:100%}

/* Compress the chrome before resorting to scrolling. */
@media (max-width:1180px){
  body{font-size:13px}
  .brand{font-size:12px}
  .topbar{gap:9px}
  .topbar .sep{display:none}
  .fleet-panel{height:176px}
  .fleet-units{padding-inline:10px}
  .fleet-info{flex-basis:185px;padding-inline:10px}
  .planet-strip{gap:8px;padding-inline:9px}
  .planet-card{font-size:12px}
  .pc-head{gap:6px;padding-inline:7px}
  .pc-body{padding-inline:7px}
  .building-grid{gap:4px}
  .building-slot{font-size:9px}
}
@media (max-width:1040px){
  .brand{display:none}
  .topbar{gap:8px;padding-inline:9px}
  .button{padding:7px 10px}
  .fleet-info{flex-basis:160px;font-size:12px}
  .unit-card{min-width:72px;padding:5px}
  .unit-card img{height:48px}
}


@media (max-width:820px){
  .topbar .stat:nth-of-type(3),.topbar .stat:nth-of-type(4){display:none}
}


.building-grid.major{grid-template-columns:repeat(4,minmax(0,1fr))}
.building-grid.minor{grid-template-columns:repeat(2,minmax(0,1fr))}


.custom-tooltip{
  position:fixed;
  z-index:10000;
  display:none;
  pointer-events:none;
  max-width:300px;
  padding:9px 11px;
  border:1px solid #586879;
  border-radius:6px;
  background:#111820;
  color:#eaf1f7;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
  font-size:12px;
  line-height:1.35;
}
.custom-tooltip.visible{display:block}
.custom-tooltip .tip-title{font-weight:700;color:#fff;margin-bottom:4px}
.custom-tooltip .tip-line{color:#c8d3dd;margin-top:2px}
.treasury-stat{cursor:help}
.treasury-delta{font-size:11px;color:#8fd09a;margin-left:3px}


.system-context-panel{
  flex:0 0 auto;
  min-width:0;
  width:100%;
}
.system-context-panel > .system-fleet-panel,
.system-context-panel > .planet-strip{
  margin:0;
}


/* v12.18: panel height affects only the amount of visible background.
   Planet/orbit geometry is isolated in a width-driven camera layer, so
   switching context panels never moves planets vertically. */
.system-view{
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}
.system-view > .sys-head{
  flex:0 0 46px;
}
.system-view > .space-scene{
  height:auto!important;
  flex:1 1 auto!important;
  min-height:220px!important;
  position:relative;
}
.system-view > .system-context-panel{
  position:relative!important;
  left:auto!important;
  right:auto!important;
  bottom:auto!important;
  width:100%;
  margin:0;
  flex:0 0 auto;
  border-top:1px solid var(--line);
  z-index:20;
}
.system-geometry{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  aspect-ratio:2.10 / 1;
  pointer-events:none;
}
.system-geometry > *{
  pointer-events:auto;
}
.system-context-panel > .planet-strip{
  flex:0 0 272px;
  height:272px;
}
.system-context-panel > .system-fleet-panel{
  flex:0 0 148px;
  height:148px;
}
.food-stat{cursor:help}
.food-positive{color:#8fd09a}


/* v12.1: local replenishment popover + planet recruitment */
.unit-row,.fleet-panel,.system-fleet-panel,.fleet-units,.unit-card{overflow:visible}

/* v12.3 — broad local recruitment tray, following the Total War pattern. */

  display:flex;
  flex-direction:column;
  background:#171d25;
  min-width:0;
}

  height:50px;

  display:flex;
  align-items:center;

  padding:7px 12px;
  border-bottom:1px solid var(--line);
}
.recruitment-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(2,94px);
  grid-auto-flow:column;
  grid-auto-columns:118px;
  gap:7px;
  padding:9px 12px 10px;
  overflow-x:auto;
  overflow-y:hidden;
  align-content:start;
  justify-content:start;
}
.recruitment-card{
  width:118px;
  height:94px;
  border:1px solid #46586b;
  border-radius:4px;
  background:#202935;
  color:var(--text);
  padding:5px;
  cursor:pointer;
  display:grid;
  grid-template-rows:53px 16px 14px;
  text-align:left;
  min-width:0;
}
.recruitment-card:hover{border-color:#90a8bf}
.recruitment-card.selected{
  border-color:#8fc6f4;
  box-shadow:0 0 0 1px #8fc6f455 inset;
  background:#233546;
}
.recruitment-card img{
  width:100%;
  height:53px;
  object-fit:contain;
}
.recruitment-name{
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.recruitment-meta{
  font-size:9px;
  color:#aab9c8;
  white-space:nowrap;
}
.recruit-selected-img{width:40px;height:32px;object-fit:contain}
.recruit-selected-name{
  max-width:145px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
}
.recruit-amount-input{
  width:64px;
  background:#202a35;
  color:var(--text);
  border:1px solid #56687a;
  border-radius:3px;
  padding:5px 6px;
  font-size:13px;
}
.recruit-cost,.recruit-time{font-size:11px;color:#cbd7e1;white-space:nowrap}


.replenish-order-indicator{
  position:absolute;
  top:5px;
  right:5px;
  z-index:2;
  padding:2px 5px;
  border:1px solid #6d92b3;
  border-radius:3px;
  background:#1b3b55e8;
  color:#dff1ff;
  font-size:9px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
  pointer-events:auto;
}


/* v12.5 — construction status belongs to the building card itself. */
.building-slot.is-constructing,
.building-slot.is-queued{
  cursor:default;
  overflow:hidden;
}
.building-slot.is-constructing img{
  opacity:.48;
  filter:saturate(.72) brightness(.82);
}
.building-slot.is-queued img{
  opacity:.68;
  filter:saturate(.8) brightness(.9);
}
.pending-slot{
  border-style:solid!important;
  color:inherit!important;
  font-size:10px!important;
}
.construction-badge{
  position:absolute;
  left:4px;
  top:4px;
  z-index:3;
  min-width:20px;
  height:20px;
  padding:0 5px;
  display:grid;
  place-items:center;
  border-radius:10px;
  font-size:10px;
  font-weight:800;
  line-height:1;
  box-shadow:0 1px 4px #0008;
}
.construction-badge.active{
  background:#d4a64c;
  color:#17130b;
  border:1px solid #f3cf77;
}
.construction-badge.queued{
  background:#394858;
  color:#d6e0e9;
  border:1px solid #718295;
}


/* v12.6 — queued recruits live in the fleet unit row. */
.unit-card.recruitment-queued{
  opacity:.62;
  border-style:dashed;
  background:#1b2430;
}
.unit-card.recruitment-queued img{
  filter:saturate(.7) brightness(.8);
}
.recruitment-turn-badge{
  position:absolute;
  left:5px;
  top:5px;
  z-index:3;
  min-width:20px;
  height:20px;
  padding:0 5px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#d4a64c;
  color:#17130b;
  border:1px solid #f3cf77;
  font-size:10px;
  font-weight:800;
}

/* v12.6 — construction / upgrade browser is a visible building chain. */
.building-browser{
  left:6px;
  right:6px;
  bottom:5px;
  padding:8px;
}
.build-browser-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}
.build-browser-head button{
  border:0;
  background:transparent;
  color:#c5d0da;
  cursor:pointer;
  font-size:18px;
}
.new-building-chains{
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:170px;
  overflow-y:auto;
}
.new-building-chain{
  display:flex;
  align-items:center;
  gap:7px;
}
.build-chain-name{
  width:72px;
  flex:0 0 72px;
  font-size:9px;
  color:#c4d0dc;
}
.build-chain{
  display:flex;
  gap:4px;
  align-items:center;
}
.build-tier{
  width:48px;
  height:58px;
  position:relative;
  border:1px solid #435263;
  border-radius:3px;
  background:#202a35;
  color:var(--text);
  padding:2px;
  cursor:default;
}
.build-tier img{
  width:100%;
  height:43px;
  object-fit:cover;
  border-radius:2px;
}
.build-tier.available{
  cursor:pointer;
  border-color:#8cafcc;
  box-shadow:0 0 0 1px #8cafcc44 inset;
}
.build-tier.available:hover{border-color:#d9ebfb}
.build-tier.built{opacity:.42}
.build-tier.current{
  border-color:#d6b05c;
  box-shadow:0 0 0 1px #d6b05c55 inset;
}
.build-tier.future,.build-tier.locked{opacity:.24}
.build-tier-level{
  position:absolute;
  right:3px;
  top:3px;
  padding:1px 3px;
  border-radius:2px;
  background:#10161dcc;
  font-size:8px;
  font-weight:700;
}
.build-turns{
  position:absolute;
  left:3px;
  top:3px;
  min-width:15px;
  padding:1px 3px;
  border-radius:8px;
  background:#d4a64c;
  color:#17130b;
  font-size:8px;
  font-weight:800;
}
.build-cost{
  position:absolute;
  left:2px;
  right:2px;
  bottom:2px;
  padding:1px 2px;
  background:#10161ddd;
  text-align:center;
  font-size:8px;
}
.empty-state{font-size:11px;color:var(--muted);padding:10px 2px}


/* v12.7 — recruitment from a planet is visible on that planet card. */
.planet-recruit{
  margin-left:auto;
  border:0;
  background:transparent;
  color:#8fc6f4;
  cursor:pointer;
  padding:0 2px;
  font-size:11px;
}
.planet-recruit-queue{
  position:absolute;
  right:6px;
  top:6px;
  z-index:7;
  display:flex;
  gap:4px;
}
.planet-recruit-order{
  position:relative;
  width:34px;
  height:34px;
  border:1px solid #6d8198;
  border-radius:4px;
  background:#18222c;
  padding:2px;
  cursor:pointer;
}
.planet-recruit-order img{
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:.72;
}
.planet-recruit-order span{
  position:absolute;
  left:-4px;
  top:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#d4a64c;
  color:#17130b;
  border:1px solid #f3cf77;
  font-size:8px;
  font-weight:800;
}

/* v12.7 — Total-War-style construction browser. */
.building-tree-browser{
  position:relative;
  left:auto;
  right:auto;
  bottom:auto;
  width:100%;
  height:300px;
  padding:0;
  border:0;
  border-radius:0;
  box-shadow:none;
  background:#151b23;
}
.building-tree-browser .build-browser-head{
  height:46px;
  margin:0;
  padding:7px 12px;
  border-bottom:1px solid var(--line);
}
.tree-categories{
  height:254px;
  display:flex;
  gap:0;
  overflow-x:auto;
  overflow-y:hidden;
  padding:9px 10px 12px;
}
.tree-category{
  flex:0 0 auto;
  min-width:230px;
  border-right:1px solid #344252;
  padding:0 12px;
}
.tree-category:first-child{padding-left:2px}
.tree-category-title{
  height:22px;
  font-size:10px;
  color:#b8c5d2;
  text-align:center;
  border-bottom:1px solid #455568;
  margin-bottom:5px;
}
.tree-category-chains{
  display:flex;
  justify-content:center;
  gap:16px;
  height:214px;
}
.tree-chain{
  width:86px;

  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  border-radius:4px;
  padding:2px;
}
.tree-chain.focused{
  background:#26334066;
  box-shadow:0 0 0 1px #7192ae55 inset;
}
.tree-tiers{
  flex:1;
  width:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}
.tree-link{
  width:2px;
  height:7px;
  flex:0 0 7px;
  background:#53677b;
}
.tree-tier{
  width:54px;
  height:42px;
  flex:0 0 42px;
  position:relative;
  border:1px solid #46576a;
  border-radius:3px;
  background:#202935;
  color:var(--text);
  padding:2px;

}
.tree-tier img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:2px;
}
.tree-tier.available{
  cursor:pointer;

}
.tree-tier.available:hover{border-color:#e5f4ff}
.tree-tier.current{
  border-color:#d6b05c;
  box-shadow:0 0 0 1px #d6b05c66 inset;
}
.tree-tier.built{opacity:.48}
.tree-tier.future{opacity:.25}
.tree-tier.locked{opacity:.16}
.tree-tier.queued{opacity:.64;border-style:dashed}
.tree-level{
  position:absolute;
  right:2px;
  top:2px;
  padding:1px 3px;
  border-radius:2px;
  background:#0f151bcc;
  font-size:7px;
  font-weight:800;
}
.tree-turns{
  position:absolute;
  left:2px;
  top:2px;
  min-width:14px;
  padding:1px 3px;
  border-radius:8px;
  background:#d4a64c;
  color:#17130b;
  font-size:7px;
  font-weight:800;
}
.tree-cost{
  position:absolute;
  left:2px;
  right:2px;
  bottom:2px;
  padding:1px 2px;
  background:#0f151bdd;
  text-align:center;
  font-size:7px;
}
.tree-mark{
  position:absolute;
  right:2px;
  bottom:2px;
  min-width:14px;
  height:14px;
  padding:0 3px;
  border-radius:7px;
  display:grid;
  place-items:center;
  background:#406b47;
  color:#e8f6ea;
  border:1px solid #7fac87;
  font-size:8px;
  font-weight:800;
}
.tree-chain-name{
  min-height:29px;
  width:86px;
  margin-top:5px;
  text-align:center;
  font-size:9px;
  line-height:1.2;
  color:#d1dbe5;
}
.tree-built-check{
  display:inline-grid;
  place-items:center;
  margin-left:3px;
  width:13px;
  height:13px;
  border-radius:7px;
  background:#406b47;
  color:#e8f6ea;
  font-size:8px;
  font-weight:800;
}


/* v12.9 — recruitment status is grouped with the Recruit action. */
.planet-recruit-group{
  margin-left:auto;
  display:inline-flex;
  align-items:center;

}
.planet-recruit{margin-left:0!important}

  margin:0!important;
  padding:7px 12px!important;
}
.tree-categories{
  height:auto!important;
  min-height:0!important;
  display:grid!important;
  grid-template-columns:repeat(3,minmax(224px,1fr))!important;
  gap:14px!important;
  padding:10px 14px 14px!important;
  overflow-x:auto!important;
  overflow-y:visible!important;
  align-items:start!important;
}
.tree-category{
  min-width:224px!important;
  height:auto!important;
  padding:0 0 12px!important;
  border:0!important;
  background:#182029!important;
  border-radius:5px!important;
}
.tree-category-title{
  height:30px!important;
  margin:0!important;
  padding:0 8px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  border:0!important;
}
.tree-category-chains{
  height:auto!important;
  display:grid!important;
  grid-template-columns:repeat(2,92px)!important;
  gap:12px!important;
  justify-content:center!important;
  align-items:start!important;
  padding:2px 8px 8px!important;
}
.tree-chain{
  width:92px!important;
  height:auto!important;
  display:block!important;
  padding:0!important;
  background:transparent!important;
  box-shadow:none!important;
}
.tree-chain.focused{
  background:#22303c!important;
  border-radius:4px!important;
}
.tree-chain-name{
  width:92px!important;
  height:30px!important;
  min-height:30px!important;
  margin:0 0 4px!important;
  padding:0 4px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  line-height:1.15!important;
}
.tree-tiers-stack{
  display:flex;
  flex-direction:column-reverse;
  align-items:center;
  gap:3px;
  padding-bottom:4px;
}
.tree-tier{
  width:56px!important;
  height:36px!important;
  min-height:36px!important;
  flex:0 0 36px!important;
}
.tree-tier img{
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
}
.tree-tiers-grid,
.tree-row,
.tree-link,
.tree-mark,
.tree-built-check{
  display:none!important;
}


/* v12.12 — fix the inherited build-picker offset instead of compensating inside the tree. */
.system-context-panel > .building-tree-browser{
  position:relative!important;
  top:auto!important;
  right:auto!important;
  bottom:auto!important;
  left:auto!important;
  margin:0!important;
  width:100%!important;
  box-sizing:border-box!important;
  padding:0 0 20px!important;
}
.building-tree-browser .build-browser-head{
  margin:0!important;
}
.building-tree-browser .tree-categories{
  margin:0!important;
  padding:10px 14px 18px!important;
}
.building-tree-browser .tree-category{
  margin:0!important;
}
.building-tree-browser .tree-category-chains{
  padding-bottom:12px!important;
}
.building-tree-browser .tree-tiers-stack{
  padding-bottom:6px!important;
}

/* The planet recruitment counter tooltip reuses exactly the queue/unit-card preview language. */
.custom-tooltip.recruit-preview-tooltip{
  max-width:520px!important;
  padding:10px!important;
}
.recruitment-preview{
  display:flex;
  gap:8px;
  align-items:flex-start;
  max-width:496px;
  overflow:hidden;
}
.recruitment-preview-unit{
  flex:0 0 112px!important;
  width:112px!important;
  min-width:112px!important;
  height:104px!important;
  max-width:112px!important;
}
.recruitment-preview-unit .queue-remove{
  display:none!important;
}


/* v12.13 — recruitment card layout cleanup */
.recruitment-choice,
.recruitment-active-unit,
.recruitment-preview-unit{
  display:grid!important;
  grid-template-rows:54px 17px 15px!important;
  align-content:start!important;
}
.recruitment-choice .unit-name,
.recruitment-active-unit .unit-name,
.recruitment-preview-unit .unit-name{
  display:block!important;
  min-width:0!important;
  max-width:100%!important;
  height:17px!important;
  line-height:17px!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  font-size:10px!important;
}
.recruitment-choice .unit-count,
.recruitment-active-unit .unit-count,
.recruitment-preview-unit .unit-count{
  display:block!important;
  min-width:0!important;
  height:15px!important;
  line-height:15px!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  font-size:9px!important;
}
.recruitment-choice img,
.recruitment-active-unit img,
.recruitment-preview-unit img{
  width:100%!important;
  height:54px!important;
  object-fit:contain!important;
  min-height:0!important;
}
.recruitment-choice,
.recruitment-active-unit,
.recruitment-preview-unit{
  padding:5px!important;
}


/* v12.14 — recruitment creates/owns a fleet and locks its movement. */
.recruiting-lock{color:#e4c26e;font-weight:700}
.locked-note{color:#d7ba68}
.empty-fleet-note{height:96px;display:flex;align-items:center;color:#8fa0b0;font-size:12px;padding:0 10px}
.fleet-marker.recruiting polygon{stroke:#d4a64c;stroke-width:2.5}
.system-fleet-marker.recruiting{border-color:#d4a64c55}
.marker-lock{position:absolute;right:-8px;top:-9px;font-size:11px;background:#182029;border:1px solid #7a683e;border-radius:9px;width:18px;height:18px;display:grid;place-items:center}
.recruiting-fleet{border-top-color:#735f32!important}


/* v12.15 — finite army/fleet stack capacity (prototype tuning value). */
.army-capacity{margin-left:8px;color:#9fb0bf;font-size:11px}
.army-capacity.full{color:#d7a66d;font-weight:700}
.recruitment-choice.capacity-full{opacity:.35!important;cursor:not-allowed!important}


/* v12.16 — fleet-owned recruitment model */
.planet-recruit-count,.recruitment-preview{display:none!important}
.forming-state{color:#d8b96e;font-weight:600;white-space:nowrap}
.system-fleet-marker.recruiting{color:#e1bd63}
.marker-turns{
  position:absolute;left:18px;top:-12px;min-width:24px;height:16px;padding:1px 5px;
  border:1px solid #b58b3f;border-radius:8px;background:#2b2417;color:#efd48f;
  font:700 9px/12px Inter,Segoe UI,Arial,sans-serif;text-align:center
}
.fleet-marker.recruiting polygon{stroke:#d4a64c;stroke-width:2.2;stroke-dasharray:3 2}
.formation-badge{fill:#2b2417;stroke:#b58b3f;stroke-width:1}
.formation-badge-text{fill:#efd48f;font-size:8px;font-weight:700;pointer-events:none}


/* v12.18 final guards against legacy fixed-height media rules. */
.system-view > .space-scene{
  height:auto!important;
  flex-basis:auto!important;
}

    fleets=fleets.map(f=>{
      if(!f.transit)return f;
      const speed=f.movementSpeed!=null?f.movementSpeed:(f.units.length?Math.min(...f.units.map(u=>SHIPS[u.type].speed||4)):0);
      const next={...f.transit,progress:Math.min(f.transit.distance,f.transit.progress+speed)};
      if(next.progress>=next.distance){
        events.push(f.name+' arrived at '+SYSTEMS[next.to].name);
        return {...f,transit:null,system:next.to,planet:null};
      }
      return {...f,transit:next};
    });

    const q=[...(this.state.queue.A||[])];
    let buildings={...this.state.buildings,A:[...this.state.buildings.A]};
    let settlementLevel=this.state.settlementLevel;
    if(q.length){
      q[0]={...q[0],turns:q[0].turns-1};
      if(q[0].turns<=0){
        const done=q.shift();
        if(done.kind==='build')buildings.A[done.slot]={type:done.type,level:BUILDINGS[done.type].start};
        if(done.kind==='upgrade'&&buildings.A[done.slot])buildings.A[done.slot]={...buildings.A[done.slot],level:buildings.A[done.slot].level+1};
        if(done.kind==='settlement'){settlementLevel++;while(buildings.A.length<(settlementLevel===5?7:5))buildings.A.push(null);}
        events.push(done.label+' completed on Planet A');
      }
    }

    const replenOrders=this.state.replenishOrders.map(o=>({...o,turns:o.turns-1}));
    const replenishStill=[];
    replenOrders.forEach(o=>{
      if(o.turns<=0){
        fleets=fleets.map(f=>f.id!==o.fleet?f:{...f,units:f.units.map(u=>u.id===o.unitId?{...u,count:Math.min(100,u.count+o.amount)}:u)});
        events.push(SHIPS[o.type].name+' replenished by +'+o.amount+' · '+this.fleetName(o.fleet));
      }else replenishStill.push(o);
    });

    fleets=fleets.map(f=>{
      const still=[]; const completed=[];
      f.recruitment.forEach(o=>{
        const next={...o,turns:o.turns-1};
        if(next.turns<=0){
          completed.push({id:'U'+nextUnitNumber++,type:o.type,count:o.amount});
          events.push('New Squad ready: '+SHIPS[o.type].name+' ×'+o.amount+' · '+f.name);
        }else still.push(next);
      });
      return {...f,units:[...f.units,...completed],recruitment:still};
    });

    if(this.state.assault) events.push('Assault on Planet B continues · Garrison 60 → 42');
    this.setState({turn:this.state.turn+1,treasury:this.state.treasury+110,fleets,nextUnitNumber,queue:{A:q},buildings,settlementLevel,replenishOrders:replenishStill,events});
  }
  canReplenish(type,fleet='A1'){
    if(this.fleetSystemOf(fleet)!=='Alpha'||this.fleetTransitOf(fleet)) return false;
    if(type==='battleship') return this.state.buildings.A.some(b=>b&&b.type==='line'&&b.level>=5);
    return true;
  }
  recruitableShips(){
    const maxLevel=chain=>this.state.buildings.A.reduce((m,b)=>b&&b.type===chain?Math.max(m,b.level):m,0);
    return SHIP_ORDER.map(type=>{
      const s=SHIPS[type];
      return {
        type,
        available:maxLevel(s.chain)>=s.tier,
        reason:`Requires ${BUILDINGS[s.chain].name} ${roman(s.tier)}`
      };
    });
  }
  availableRecruitShips(){
    return this.recruitableShips().filter(x=>x.available);
  }
  handleAction(action,el,e){
    const d=el.dataset;
    if(action==='open-system') this.setState({view:'system',selectedSystem:d.system,systemPanel:'planets',fleetMode:'composition',buildPicker:null,replenish:null,replenishAmount:null,recruit:null});
    if(action==='back-galaxy') this.setState({view:'galaxy',buildPicker:null,replenish:null,replenishAmount:null,recruit:null});
    if(action==='select-planet') this.setState({systemPanel:'planets',fleetMode:'composition',buildPicker:null,replenish:null,replenishAmount:null,recruit:null});
    if(action==='select-fleet'){
      const fleet=d.fleet||'A1';
      if(this.state.view==='galaxy'&&this.state.selectedFleet===fleet){
        this.setState({selectedFleet:null,replenish:null,replenishAmount:null});
      }else{
        this.setState({selectedFleet:fleet,systemPanel:'fleet',fleetMode:'composition',buildPicker:null,replenish:null,replenishAmount:null,recruit:null});
      }
    }
    if(action==='clear-fleet'&&this.state.view==='galaxy'){
      this.setState({selectedFleet:null,replenish:null,replenishAmount:null});
    }
    if(action==='end-turn') this.endTurn();
    if(action==='move-system'){
      e.preventDefault();
      const fleet=this.state.selectedFleet;
      if(!fleet||!this.fleetExists(fleet))return;
      if(this.fleetHasRecruitment(fleet)){this.flash('Movement unavailable: recruitment in progress');return;}
      const currentTransit=this.fleetTransitOf(fleet);
      const from=currentTransit?currentTransit.to:this.fleetSystemOf(fleet);
      const to=d.system, dist=this.routeDistance(from,to);
      if(dist==null){this.flash('No direct route. Choose a neighboring system.');return;}
      const next={from,to,distance:dist,progress:0};
      this.setState({fleets:this.state.fleets.map(f=>f.id===fleet?{...f,transit:next,planet:null}:f)});
      this.flash(this.fleetName(fleet)+' sent to '+SYSTEMS[to].name);
    }
    if(action==='reverse'){
      const fleet=this.state.selectedFleet;if(!fleet)return;
      this.setState({fleets:this.state.fleets.map(f=>f.id===fleet?{...f,transit:null}:f)});
      this.flash('Fleet reversed toward the origin system');
    }
    if(action==='battle-preview') this.setState({battle:true,battleResult:false});
    if(action==='battle-cancel') this.setState({battle:false});
    if(action==='battle-confirm'){
      const losses={corvette:51,frigate:83,cruiser:31,battleship:6};
      const fleets=this.state.fleets.map(f=>f.id!=='A1'?f:{...f,units:f.units.map(u=>losses[u.type]!=null?{...u,count:losses[u.type]}:u)});
      this.setState({battle:false,battleResult:true,fleets});
    }
    if(action==='battle-close') this.setState({battleResult:false});
    if(action==='start-assault'){e.preventDefault();const target=d.planet||'B';this.setState({assault:true});this.flash('1st Fleet started an assault on '+target);}
    if(action==='build-slot') this.setState({buildPicker:{planet:'A',slot:+d.slot,upgrade:false},replenish:null,recruit:null});
    if(action==='upgrade-building') this.setState({buildPicker:{planet:'A',slot:+d.slot,upgrade:true,type:d.type,level:+d.level},replenish:null,recruit:null});
    if(action==='close-build') this.setState({buildPicker:null});
    if(action==='build-choice'){
      const bp=this.state.buildPicker;if(!bp)return;
      const type=bp.upgrade?bp.type:d.type;
      const level=bp.upgrade?bp.level+1:+d.level;
      const cost=this.buildingCost(type,level), turns=this.buildingTurns(type,level);
      if(cost>this.state.treasury){this.flash('Not enough money');return;}
      const order=bp.upgrade
        ? {kind:'upgrade',slot:bp.slot,type,label:BUILDINGS[type].name+' '+roman(level),turns}
        : {kind:'build',slot:bp.slot,type,label:BUILDINGS[type].name+' '+roman(level),turns};
      this.setState({treasury:this.state.treasury-cost,queue:{A:[...(this.state.queue.A||[]),order]},buildPicker:null});
    }
    if(action==='settlement-upgrade'){
      if(this.state.settlementLevel>=5){this.flash('Settlement is already at maximum level');return;}
      const q={A:[...(this.state.queue.A||[]),{kind:'settlement',label:'Settlement '+roman(this.state.settlementLevel+1),turns:3}]};
      this.setState({queue:q,buildPicker:null});
    }
    if(action==='replenish-open'){
      const fleet=d.fleet||this.state.selectedFleet||'A1', unitId=d.unit;
      const f=this.fleetById(fleet), unit=f&&f.units.find(u=>u.id===unitId);
      if(!unit)return;
      if(!this.canReplenish(unit.type,fleet)){this.flash('Required military infrastructure is not available in this system');return;}
      this.setState({replenish:{fleet,unitId},replenishAmount:Math.max(1,100-unit.count),buildPicker:null,recruit:null});
    }
    if(action==='replenish-close') this.setState({replenish:null,replenishAmount:null});
    if(action==='replenish-confirm'){
      const r=this.state.replenish;if(!r)return;
      const f=this.fleetById(r.fleet), unit=f&&f.units.find(u=>u.id===r.unitId);if(!unit)return;
      const missing=Math.max(0,100-unit.count);
      const add=Math.max(1,Math.min(missing,Number(this.state.replenishAmount||missing)));
      const cost=add*SHIPS[unit.type].cost;
      if(cost>this.state.treasury){this.flash('Not enough money');return;}
      this.setState({
        treasury:this.state.treasury-cost,
        replenishOrders:[...this.state.replenishOrders,{fleet:r.fleet,unitId:r.unitId,type:unit.type,amount:add,turns:SHIPS[unit.type].rounds}],
        replenish:null,
        replenishAmount:null
      });
      this.flash(SHIPS[unit.type].name+' ×'+add+' ordered for replenishment');
    }

    if(action==='recruit-open'){
      const source=d.source||'fleet';
      if(source==='planet'){
        const planet=d.planet||'Planet A';
        this.setState({
          recruit:{source:'planet',planet,system:this.state.selectedSystem},
          buildPicker:null,replenish:null,replenishAmount:null
        });
        return;
      }
      const fleet=d.fleet||this.state.selectedFleet||'A1';
      const f=this.fleetById(fleet);if(!f)return;
      if(f.transit){this.flash('Recruitment unavailable while travelling');return;}
      if(f.system!=='Alpha'){this.flash('No eligible local shipyard in this system');return;}
      this.setState({
        selectedFleet:fleet,
        recruit:{source:'fleet',fleet,system:f.system,planet:f.planet||'Planet A'},
        buildPicker:null,replenish:null,replenishAmount:null
      });
    }
    if(action==='recruit-close') this.setState({recruit:null});
    if(action==='recruit-type'){
      const r=this.state.recruit;if(!r)return;
      const item=this.recruitableShips().find(x=>x.type===d.type);
      if(!item||!item.available)return;
      const type=d.type, amount=100, cost=amount*SHIPS[type].cost;
      if(cost>this.state.treasury){this.flash('Not enough money');return;}

      let fleets=this.state.fleets.map(f=>({...f,recruitment:[...f.recruitment]}));
      let fleetId=r.fleet, nextFleetNumber=this.state.nextFleetNumber;
      if(r.source==='planet'){
        const n=nextFleetNumber++;
        fleetId='A'+n;
        fleets.push({id:fleetId,name:n+(n===1?'st Fleet':n===2?'nd Fleet':n===3?'rd Fleet':'th Fleet'),system:r.system,planet:r.planet,transit:null,movementSpeed:null,formedAtPlanet:true,units:[],recruitment:[]});
      }
      const target=fleets.find(f=>f.id===fleetId);if(!target)return;
      if(target.units.length+target.recruitment.length>=FLEET_STACK_LIMIT){this.flash('Army capacity reached');return;}
      const order={id:'Q'+this.state.nextOrderNumber,type,amount,turns:SHIPS[type].rounds,planet:r.planet||target.planet||'Planet A',system:r.system||target.system};
      target.recruitment.push(order);
      const recruit={source:'fleet',fleet:fleetId,system:target.system,planet:order.planet};
      this.setState({
        treasury:this.state.treasury-cost,
        fleets,
        nextFleetNumber,
        nextOrderNumber:this.state.nextOrderNumber+1,
        selectedFleet:fleetId,
        systemPanel:'fleet',
        recruit
      });
    }
    if(action==='recruit-cancel'){
      const fleetId=d.fleet, orderId=d.order;
      const f=this.fleetById(fleetId);if(!f)return;
      const order=f.recruitment.find(o=>o.id===orderId);if(!order)return;
      const refund=order.amount*SHIPS[order.type].cost;
      let fleets=this.state.fleets.map(x=>x.id!==fleetId?x:{...x,recruitment:x.recruitment.filter(o=>o.id!==orderId)});
      const updated=fleets.find(x=>x.id===fleetId);
      let selectedFleet=this.state.selectedFleet, recruit=this.state.recruit;
      if(updated&&updated.formedAtPlanet&&!updated.units.length&&!updated.recruitment.length){
        fleets=fleets.filter(x=>x.id!==fleetId);
        if(selectedFleet===fleetId)selectedFleet=null;
        if(recruit&&recruit.fleet===fleetId)recruit={source:'planet',planet:order.planet,system:order.system};
      }
      this.setState({treasury:this.state.treasury+refund,fleets,selectedFleet,recruit});
    }
  }
  onClick=(e)=>{const el=e.target.closest('[data-action]');if(el)this.handleAction(el.dataset.action,el,e);};
  onContextMenu=(e)=>{const el=e.target.closest('[data-context]');if(el)this.handleAction(el.dataset.context,el,e);};
  onChange=(e)=>{
    const el=e.target;
    if(el.matches&&el.matches('[data-replenish-amount]')){
      const max=+el.max||100;
      const value=Math.max(1,Math.min(max,Number(el.value)||1));
      this.setState({replenishAmount:value});
    }
  };
  tooltipNode=()=>document.getElementById('ts-custom-tooltip');
  showTooltip=(e)=>{
    const el=e.target.closest&&e.target.closest('[data-tooltip]');
    const tip=this.tooltipNode();
    if(!tip||!el){if(tip)tip.classList.remove('visible');return;}
    const parts=String(el.dataset.tooltip||'').split(' · ').filter(Boolean);
    if(!parts.length){tip.classList.remove('visible');return;}
    tip.innerHTML=`<div class="tip-title">${esc(parts[0])}</div>${parts.slice(1).map(x=>`<div class="tip-line">${esc(x)}</div>`).join('')}`;
    tip.classList.add('visible');
    this.moveTooltip(e);
  };;
  moveTooltip=(e)=>{
    const tip=this.tooltipNode();
    if(!tip||!tip.classList.contains('visible'))return;
    const gap=14, margin=10;
    let x=e.clientX+gap, y=e.clientY+gap;
    const w=tip.offsetWidth||220, h=tip.offsetHeight||60;
    if(x+w+margin>window.innerWidth)x=Math.max(margin,e.clientX-w-gap);
    if(y+h+margin>window.innerHeight)y=Math.max(margin,e.clientY-h-gap);
    tip.style.left=x+'px'; tip.style.top=y+'px';
  };
  hideTooltip=()=>{const tip=this.tooltipNode();if(tip)tip.classList.remove('visible');};
  replenishMenu(type,count){
    const missing=Math.max(1,100-count);
    const amount=Math.max(1,Math.min(missing,Number(this.state.replenishAmount||missing)));
    const s=SHIPS[type];
    return `<div class="replenish-menu" data-tooltip="">
      <div class="mini-head"><b>Replenishment · ${s.name}</b><button data-action="replenish-close">×</button></div>
      <div class="amount-box compact">
        <input aria-label="Number of ships to replenish" data-replenish-amount type="number" min="1" max="${missing}" value="${amount}">
      </div>
      <div class="price-line">Cost: <b>${amount*s.cost}</b></div>
      <button class="button primary confirm-wide" data-action="replenish-confirm">Confirm</button>
    </div>`;
  }
  shipTooltip(type,count=null){
    const s=SHIPS[type];
    const chain=BUILDINGS[s.chain];
    const parts=[
      s.name,
      `Class: ${chain.name} ${roman(s.tier)}`,
      `Cost: ${s.cost}`,
      `Upkeep: ${s.upkeep}`,
      `Recruitment: ${s.rounds} rnd.`
    ];
    if(count!=null)parts.splice(1,0,`Ships: ${count}/100`);

  }
  shipCard(type,count,extra=''){
    const s=SHIPS[type];
    return `<div class="unit-card" data-tooltip="${esc(this.shipTooltip(type,count))}">
      <img src="${s.img}">
      <div class="unit-name">${s.name}</div>
      <div class="unit-count">${count} / 100</div>
      ${extra}
    </div>`;
  }
  shipCards(fleetId){
    const f=this.fleetById(fleetId);if(!f)return'';
    return f.units.map(unit=>{
      const type=unit.type,count=unit.count,s=SHIPS[type],damaged=count<100,can=this.canReplenish(type,fleetId);
      const orders=this.state.replenishOrders.filter(o=>o.fleet===fleetId&&o.unitId===unit.id);
      const pendingAmount=orders.reduce((sum,o)=>sum+o.amount,0);
      const pendingTurns=orders.length?Math.min(...orders.map(o=>o.turns)):null;
      const tip=`${this.shipTooltip(type,count)}${damaged?' · Losses: '+(100-count):''}${pendingAmount?' · Replenishment: +'+pendingAmount+' · '+pendingTurns+' rnd.':''}${damaged&&!can?' · Required infrastructure unavailable':''}`;
      const replenishOpen=this.state.replenish&&this.state.replenish.fleet===fleetId&&this.state.replenish.unitId===unit.id;
      return `<div class="unit-card ${damaged?'damaged':''}" data-tooltip="${esc(tip)}">
        <img src="${s.img}">
        <div class="unit-name">${s.name}</div>
        <div class="unit-count">${count} / 100</div>
        ${pendingAmount?`<div class="replenish-order-indicator" data-tooltip="Replenishment · +${pendingAmount} · ${pendingTurns} rnd.">+${pendingAmount} · ${pendingTurns}r</div>`:''}
        ${damaged&&can?`<button class="replenish-plus" data-action="replenish-open" data-fleet="${fleetId}" data-unit="${unit.id}" data-tooltip="Replenish">+</button>`:''}
        ${damaged&&!can?`<span class="replenish-plus disabled" data-tooltip="Required military infrastructure unavailable">+</span>`:''}
        ${replenishOpen?this.replenishMenu(type,count):''}
      </div>`;
    }).join('');
  }
  recruitedCards(fleet){return'';}
  recruitmentQueueCards(fleetId){

      return `<div class="unit-card recruitment-queued" data-tooltip="${esc(this.shipTooltip(o.type,o.amount)+' · Queued:  '+o.turns+' rnd.')}">

  ownerFill(owners){return owners.length>1?'mix':owners[0]==='A'?'#67a9e6':owners[0]==='B'?'#df7373':'#a5a9ae';}
  fleetPoint(fleetId='A1'){
    const f=this.fleetById(fleetId);if(!f)return {x:SYSTEMS.Alpha.x,y:SYSTEMS.Alpha.y};
    if(f.transit){
      const a=SYSTEMS[f.transit.from],b=SYSTEMS[f.transit.to],t=f.transit.distance?f.transit.progress/f.transit.distance:0;
      return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};

    const n=SYSTEMS[f.system]||SYSTEMS.Alpha;
    return {x:n.x,y:n.y};

  systemPlanets(){
    if(this.state.selectedSystem==='Alpha')return [
      {id:'A',name:'Planet A',owner:'A',level:this.state.settlementLevel,garrison:80,interactive:true,isMajor:true},
      {id:'B',name:'Planet B',owner:'B',level:2,garrison:this.state.assault?42:60,isMajor:false},
      {id:'C',name:'Planet C',owner:'N',level:1,garrison:20,isMajor:false}
    ];
    const o=SYSTEMS[this.state.selectedSystem].owners;
    const counts={Beta:2,Gamma:4,Delta:2,Epsilon:5,Zeta:4,Eta:3,Theta:2};
    const count=counts[this.state.selectedSystem]||3;
    let pattern;
    if(o.length>1) pattern=['A','B','N','A','B'];
    else if(o[0]==='A') pattern=['A','A','N','A','N'];
    else if(o[0]==='B') pattern=['B','B','N','B','N'];
    else pattern=['N','N','N','N','N'];
    const owners=pattern.slice(0,count);
    const levels=[3,2,1,2,1], garrisons=[70,45,20,35,15];
    return owners.map((owner,i)=>({id:this.state.selectedSystem+i,name:'Planet '+roman(i+1),owner,level:levels[i],garrison:garrisons[i],interactive:false,isMajor:i===0}));
  }

          : recruiting

  galaxy(){
    const allTransits=this.state.fleets.map(f=>f.transit).filter(Boolean);
    const routeSvg=ROUTES.map(r=>{const a=SYSTEMS[r[0]],b=SYSTEMS[r[1]],active=allTransits.some(t=>(t.from===r[0]&&t.to===r[1])||(t.from===r[1]&&t.to===r[0]));return `<line class="route ${active?'active':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;}).join('');
    const nodes=Object.entries(SYSTEMS).map(([k,n])=>{const own=n.owners.map(ownerName).join(', '),fill=this.ownerFill(n.owners);const inner=fill==='mix'?`<circle cx="${n.x-3}" cy="${n.y}" r="7" fill="#67a9e6"/><circle cx="${n.x+4}" cy="${n.y}" r="7" fill="#df7373"/>`:`<circle cx="${n.x}" cy="${n.y}" r="9" fill="${fill}"/>`;return `<g class="system-node ${this.state.selectedSystem===k?'selected':''}" data-action="open-system" data-context="move-system" data-system="${k}" data-tooltip="${esc(n.name)} · ${esc(own)}${n.known?'':' · unknown'}" style="opacity:${n.known?1:.38}"><circle class="outer" cx="${n.x}" cy="${n.y}" r="15"/>${inner}<text class="node-label" x="${n.x+20}" y="${n.y+4}">${esc(n.name)}</text></g>`}).join('');
    const fleets=this.state.fleets.map((f,i)=>{
      const p=this.fleetPoint(f.id), ring=Math.floor(i/6), angle=(i%6)*Math.PI/3-Math.PI/6, radius=18+ring*8;
      const ox=Math.cos(angle)*radius, oy=Math.sin(angle)*radius;
      const selected=this.state.selectedFleet===f.id,recruiting=f.recruitment.length>0,eta=this.fleetRecruitmentTurns(f.id);
      const x=p.x+ox,y=p.y+oy;
      return `<g class="fleet-marker ${selected?'selected':''} ${recruiting?'recruiting':''}" data-action="select-fleet" data-fleet="${f.id}" data-tooltip="${f.name} · Faction A${recruiting?' · forming · '+eta+' rnd.':''} · ${selected?'click — deselect':'click — select'}"><polygon points="${x},${y-8} ${x+15},${y} ${x},${y+8}" fill="#67a9e6"/>${recruiting?`<rect class="formation-badge" x="${x-7}" y="${y-23}" width="23" height="12" rx="5"/><text class="formation-badge-text" x="${x+4.5}" y="${y-14}" text-anchor="middle">${eta}r</text>`:''}</g>`;
    }).join('');
    return `<div class="galaxy">
      <div class="map-wrap" data-action="clear-fleet">
        <svg viewBox="0 0 760 300">${routeSvg}${nodes}${fleets}<g class="fleet-marker" data-context="battle-preview" data-tooltip="Fleet B · Faction B · RMB — preview battle"><polygon points="448,78 464,86 448,94" fill="#df7373"/></g></svg>
        ${this.status()}${this.events()}
      </div>
      ${this.state.recruit?this.recruitmentPanel():this.galaxyFleetPanel()}
      ${this.overlay()}
    </div>`;
  }
  flag(owner){return `<div class="flag ${owner==='A'?'a':owner==='B'?'b':'n'}">${owner}</div>`;}
  buildingSlot(b,i){
    const queue=this.state.queue.A||[];
    const pendingIndex=queue.findIndex(q=>q.slot===i&&(q.kind==='build'||q.kind==='upgrade'));
    const pending=pendingIndex>=0?queue[pendingIndex]:null;
    const active=pendingIndex===0;

    if(!b){
      if(pending&&pending.kind==='build'){
        const level=BUILDINGS[pending.type].start;
        return `<div class="building-slot pending-slot ${active?'is-constructing':'is-queued'}"
          data-tooltip="${BUILDINGS[pending.type].name} ${roman(level)} · ${active?'building':'queued'} · ${pending.turns} rnd.">
          <img src="${buildingImg(pending.type,level)}">
          ${BUILDINGS[pending.type].name} ${roman(level)}
          <span class="construction-badge ${active?'active':'queued'}">${pending.turns}</span>
        </div>`;
      }
      return `<div class="building-slot empty" data-action="build-slot" data-slot="${i}" data-tooltip="Build">+</div>`;
    }

    const def=BUILDINGS[b.type];
    if(pending&&pending.kind==='upgrade'){
      return `<div class="building-slot ${active?'is-constructing':'is-queued'}"
        data-tooltip="${def.name} ${roman(b.level)} · upgrade to ${roman(b.level+1)} · ${active?'building':'queued'} · ${pending.turns} rnd.">
        <img src="${buildingImg(b.type,b.level)}">
        ${def.name} ${roman(b.level)}
        <span class="construction-badge ${active?'active':'queued'}">↑${pending.turns}</span>
      </div>`;
    }

    return `<div class="building-slot" data-action="upgrade-building" data-slot="${i}" data-type="${b.type}" data-level="${b.level}" data-tooltip="Click — upgrade"><img src="${buildingImg(b.type,b.level)}">${def.name} ${roman(b.level)}</div>`;
  }
  planetCard(p){
    const ours=p.owner==='A', interactive=p.interactive, builds=interactive?this.state.buildings.A:[];
    // Major planet: max 8 total building cards (Settlement + 7 normal).
    // Minor planet: max 4 total building cards (Settlement + 3 normal).
    // Both are always displayed in exactly two rows.
    const totalCapacity=p.isMajor?8:4;
    const unlockedTotal=p.isMajor
      ? ({1:2,2:3,3:4,4:6,5:8}[Math.min(5,p.level)]||2)
      : ({1:2,2:3,3:4}[Math.min(3,p.level)]||2);
    const unlockedNormal=unlockedTotal-1;
    const gridClass=p.isMajor?'major':'minor';

    let body='';
    if(ours&&interactive){
      const cells=[];
      const settlementQueue=this.state.queue.A||[];
      const settlementPendingIndex=settlementQueue.findIndex(q=>q.kind==='settlement');
      const settlementPending=settlementPendingIndex>=0?settlementQueue[settlementPendingIndex]:null;
      const settlementActive=settlementPendingIndex===0;
      cells.push(settlementPending
        ? `<div class="building-slot settlement-slot ${settlementActive?'is-constructing':'is-queued'}"
            data-tooltip="Settlement ${roman(this.state.settlementLevel)} · upgrade to ${roman(this.state.settlementLevel+1)} · ${settlementActive?'building':'queued'} · ${settlementPending.turns} rnd.">
            <img src="${settlementImg(this.state.settlementLevel)}">
            Settlement ${roman(this.state.settlementLevel)}
            <span class="construction-badge ${settlementActive?'active':'queued'}">↑${settlementPending.turns}</span>
          </div>`
        : `<div class="building-slot settlement-slot" data-action="settlement-upgrade" data-tooltip="Settlement ${roman(this.state.settlementLevel)} · click — upgrade"><img src="${settlementImg(this.state.settlementLevel)}">Settlement ${roman(this.state.settlementLevel)}</div>`);
      for(let i=0;i<totalCapacity-1;i++){
        if(i<unlockedNormal){
          cells.push(this.buildingSlot(builds[i]||null,i));
        }else{
          cells.push(`<div class="building-slot locked-slot" data-tooltip="Slot unlocks at a higher Settlement level">·</div>`);
        }
      }
      body=`<div class="building-grid ${gridClass}">${cells.join('')}</div>`;
    } else if(ours){
      const cells=[`<div class="building-slot settlement-slot" data-tooltip="Settlement ${roman(p.level)}"><img src="${settlementImg(p.level)}">Settlement ${roman(p.level)}</div>`];
      const demo=[['economy',Math.min(2,p.level)],['agriculture',Math.min(2,p.level)]];
      for(let i=0;i<totalCapacity-1;i++){
        if(i>=unlockedNormal){
          cells.push(`<div class="building-slot locked-slot" data-tooltip="Slot unlocks at a higher Settlement level">·</div>`);
        }else if(i<demo.length){
          const [t,l]=demo[i];
          cells.push(`<div class="building-slot" data-tooltip="${BUILDINGS[t].name} ${roman(l)}"><img src="${buildingImg(t,l)}">${BUILDINGS[t].name}</div>`);
        }else{
          cells.push(`<div class="building-slot empty" data-tooltip="Empty slot">+</div>`);
        }
      }
      body=`<div class="building-grid ${gridClass}">${cells.join('')}</div>`;
    } else {
      body=`<div class="foreign-flag" data-context="start-assault" data-planet="${esc(p.name)}" data-tooltip="${ownerName(p.owner)} · garrison ${p.garrison} · RMB with selected Fleet — assault">${this.flag(p.owner)}</div>`;
    }

    return `<div class="planet-card ${p.isMajor?'major':'minor'} ${interactive?'selected':''}" data-action="select-planet" data-planet="${esc(p.id)}"><div class="pc-head"><div class="planet-mini"></div><div><div class="pc-name">${esc(p.name)}</div><div class="tiny">${p.isMajor?'Major · ':''}${ownerName(p.owner)} · Settlement ${roman(p.level)}</div></div></div><div class="pc-body">${body}</div><div class="pc-foot"><span>Garrison ${p.garrison}</span><span>${ours?'Income +'+(p.interactive?220:140):'Foreign planet'}</span>${ours&&interactive?`<span class="planet-recruit-group"><button class="planet-recruit" data-action="recruit-open" data-source="planet" data-planet="${esc(p.name)}">Recruitment</button></span>`:''}</div></div>`;
  }
  recruitmentOrderCard(o,fleetId){
    const s=SHIPS[o.type];
    const remove=`<button class="queue-remove" data-action="recruit-cancel" data-fleet="${fleetId}" data-order="${o.id}" data-tooltip="Cancel recruitment">×</button>`;
    return `<div class="unit-card recruitment-queued recruitment-active-unit" data-tooltip="${esc(this.shipTooltip(o.type,o.amount)+' · Queued:  '+o.turns+' rnd.')}">
      <img src="${s.img}">
      <div class="unit-name">${s.name}</div>
      <div class="unit-count">${o.amount} / 100</div>
      <span class="recruitment-turn-badge">${o.turns}</span>
      ${remove}
    </div>`;
  }
  recruitmentPanel(){
    const r=this.state.recruit;if(!r)return'';
    const available=this.availableRecruitShips();
    const sourceName=r.source==='planet'?r.planet:this.fleetName(r.fleet);
    const target=r.source==='fleet'?this.fleetById(r.fleet):null;
    const queue=target?target.recruitment:[];
    const used=target?target.units.length+target.recruitment.length:0;
    const full=used>=FLEET_STACK_LIMIT;

    return `<div class="recruitment-panel ${queue.length?'has-active':''}">
      <div class="recruitment-head">
        <button class="subtle-button" data-action="recruit-close">← ${esc(sourceName)}</button>
        <b>Recruitment</b>
        <span class="army-capacity ${full?'full':''}">Squads ${used} / ${FLEET_STACK_LIMIT}</span>
      </div>

      ${queue.length?`<div class="recruitment-active">${queue.map(o=>this.recruitmentOrderCard(o,target.id)).join('')}</div>`:''}

      <div class="recruitment-grid ${queue.length?'with-active':''}">
        ${available.map(x=>{
          const s=SHIPS[x.type];
          return `<button class="unit-card recruitment-choice ${full?'capacity-full':''}" ${full?'disabled':''} data-action="recruit-type" data-type="${x.type}"
            data-tooltip="${esc(this.shipTooltip(x.type)+(full?' · Army capacity reached':''))}">
            <img src="${s.img}">
            <div class="unit-name">${s.name}</div>
            <div class="unit-count">${s.cost} · ${s.rounds} rnd.</div>
          </button>`;
        }).join('')}
      </div>
    </div>`;
  }
  buildingCost(type,level){
    const base={economy:500,agriculture:500,light:700,strike:850,line:1000,carrier:1400}[type]||700;
    return Math.round((base*(.7+.3*level))/100)*100;
  }
  buildingTurns(type,level){
    return Math.max(2,Math.min(4,Math.ceil(level/2)+(type==='carrier'?1:0)));
  }
  buildPicker(){
    const bp=this.state.buildPicker;if(!bp)return'';

    const categories=[
      {name:'Infrastructure',types:['economy','agriculture']},
      {name:'Basic Shipyards',types:['light','strike']},
      {name:'Advanced Shipyards',types:['line','carrier']}
    ];
    const queue=this.state.queue.A||[];
    const existingByType=new Map(this.state.buildings.A.filter(Boolean).map(b=>[b.type,b]));

    const tierState=(type,level)=>{
      const def=BUILDINGS[type];
      const existing=existingByType.get(type);
      const queued=queue.find(q=>q.type===type&&(q.kind==='build'||q.kind==='upgrade'));
      const maxAllowed=this.state.settlementLevel;

      let state='future', action='';
      if(existing){
        if(level<existing.level)state='built';
        else if(level===existing.level)state='current';
        else if(level===existing.level+1&&level<=maxAllowed&&!queued){state='available';action='build-choice';}
        else if(level>maxAllowed)state='locked';
      }else if(queued){
        if(level===def.start)state='queued';
        else if(level>maxAllowed)state='locked';
      }else if(!bp.upgrade&&level===def.start&&level<=maxAllowed){
        state='available';action='build-choice';
      }else if(level>maxAllowed){
        state='locked';
      }

      if(bp.upgrade&&bp.type!==type){
        if(existing)state=level<=existing.level?'built':'future';
        else state='future';
        action='';
      }
      return {state,action,queued};
    };

    const renderTier=(type,level)=>{
      const def=BUILDINGS[type];
      const {state,action,queued}=tierState(type,level);
      const cost=this.buildingCost(type,level);
      const turns=this.buildingTurns(type,level);
      const attrs=action?`data-action="${action}" data-type="${type}" data-level="${level}"`:'';
      const tooltip=state==='locked'
        ? `${def.name} ${roman(level)} · requires Settlement ${roman(level)}`
        : state==='available'
          ? `${def.name} ${roman(level)} · ${cost} · ${turns} rnd.`
          : state==='current'
            ? `${def.name} ${roman(level)} · current level`
            : state==='built'
              ? `${def.name} ${roman(level)} · built`
              : state==='queued'
                ? `${def.name} ${roman(level)} · building · ${queued.turns} rnd.`
                : `${def.name} ${roman(level)}`;

      return `<button class="tree-tier ${state}" ${attrs} data-tooltip="${tooltip}">
        <img src="${buildingImg(type,level)}">
        <span class="tree-level">${roman(level)}</span>
        ${state==='available'?`<span class="tree-turns">${turns}</span><span class="tree-cost">${cost}</span>`:''}
        ${state==='queued'?`<span class="tree-queued-turns">${queued.turns}</span>`:''}
      </button>`;
    };

    const renderChain=type=>{
      const def=BUILDINGS[type];
      const levels=[];
      for(let level=def.start;level<=def.max;level++)levels.push(renderTier(type,level));
      return `<div class="tree-chain ${bp.upgrade&&bp.type===type?'focused':''}">
        <div class="tree-chain-name">${def.name}</div>
        <div class="tree-tiers-stack">${levels.join('')}</div>
      </div>`;
    };

    return `<div class="build-picker building-tree-browser">
      <div class="build-browser-head">
        <button class="subtle-button" data-action="close-build">← Planet A</button>
        <b>${bp.upgrade?'Upgrade':'Construction'}</b>
      </div>
      <div class="tree-categories">
        ${categories.map(cat=>`<section class="tree-category">
          <div class="tree-category-title">${cat.name}</div>
          <div class="tree-category-chains">${cat.types.map(renderChain).join('')}</div>
        </section>`).join('')}
      </div>
    </div>`;
  }
  planetScenePosition(i,count){
    // Positions are schematic and intentionally independent of planet count.
    // Supports 1..5 planets without assuming that a third planet exists.
    const layouts={
      1:[['72%','49%']],
      2:[['72%','63%'],['25%','31%']],
      3:[['76%','67%'],['24%','29%'],['68%','22%']],
      4:[['77%','66%'],['23%','28%'],['66%','20%'],['33%','71%']],
      5:[['78%','66%'],['22%','28%'],['66%','19%'],['34%','72%'],['82%','32%']]
    };
    const arr=layouts[Math.min(5,Math.max(1,count))]||layouts[3];
    return arr[Math.min(i,arr.length-1)];
  }
  system(){
    const ps=this.systemPlanets();
    const dotClass=o=>o==='A'?'ours':o==='B'?'enemy':'neutral';
    const assault=this.state.selectedSystem==='Alpha'&&this.state.assault;
    const planetTip=p=>`${p.name} · ${p.isMajor?'major planet · ':''}${ownerName(p.owner)} · Settlement ${roman(p.level)} · garrison ${p.garrison}${assault&&p.id==='B'?' · under assault':''}`;
    const fleetsHere=this.fleetsInSystem(this.state.selectedSystem);

    const planetsScene=ps.map((p,i)=>{
      const [left,top]=this.planetScenePosition(i,ps.length);
      const isAssault=assault&&p.id==='B';
      const context=p.owner!=='A'?'data-context="start-assault" data-planet="'+esc(p.id)+'"':'';
      const tagColor=p.owner==='B'?'#df7373':'#dfe6ed';
      return `<div class="planet-dot ${dotClass(p.owner)} ${isAssault?'assault':''}" style="left:${left};top:${top};transform:translate(-50%,-50%)" data-action="select-planet" data-planet="${esc(p.id)}" data-tooltip="${esc(planetTip(p))}" ${context}></div>
        <div class="planet-tag" style="left:${left};top:calc(${top} - 48px);transform:translateX(-50%);color:${tagColor};white-space:nowrap">${esc(p.name)}${isAssault?' · assault':''}</div>`;
    }).join('');

    const friendlyFleets=fleetsHere.map((fleet,i)=>{
      const col=i%4,row=Math.floor(i/4),left=(53+col*6)+'%',top=(56+row*8+(i%2?3:-2))+'%';
      const recruiting=this.fleetHasRecruitment(fleet),eta=this.fleetRecruitmentTurns(fleet);
      return `<div class="system-fleet-marker ours ${this.state.systemPanel==='fleet'&&this.state.selectedFleet===fleet?'selected':''} ${recruiting?'recruiting':''}" style="left:${left};top:${top}" data-action="select-fleet" data-fleet="${fleet}" data-tooltip="${this.fleetName(fleet)} · friendly${recruiting?' · forming · '+eta+' rnd.':''} · click — select">➤${recruiting?`<span class="marker-turns">${eta}r</span>`:''}</div>`;
    }).join('');
    const enemyFleet = this.state.selectedSystem==='Alpha'
      ? `<div class="system-fleet-marker enemy" style="left:28%;top:40%" data-context="battle-preview" data-tooltip="Fleet B · Faction B · RMB — preview battle">➤</div>`
      : '';

    return `<div class="system-view">
      <div class="sys-head"><span class="back" data-action="back-galaxy">← Galaxy</span><b>${esc(SYSTEMS[this.state.selectedSystem].name)}</b><span class="grow"></span><span class="food-stat" data-tooltip="Food · Production: 12 · Consumption: 9 · Balance: +3">Food <b class="food-positive">+3</b></span></div>
      <div class="space-scene"><div class="system-geometry"><div class="orbit"></div><div class="orbit o2"></div><div class="sun"></div>${planetsScene}${friendlyFleets}${enemyFleet}</div></div>
      <div class="system-context-panel">
        ${this.state.recruit
          ? this.recruitmentPanel()
          : this.state.buildPicker
            ? this.buildPicker()
            : this.state.systemPanel==='fleet' && this.state.selectedFleet && fleetsHere.includes(this.state.selectedFleet)
              ? this.systemFleetPanel()
              : `<div class="planet-strip">${ps.map(p=>this.planetCard(p)).join('')}</div>`}
      </div>
      ${this.status()}${this.overlay()}
    </div>`;
  }
  canReplenishInCurrentSystem(){
    // Prototype: replenishment is possible only where the fleet is physically
    // present and our system has the required military infrastructure.
    const fleet=this.state.selectedFleet||'A1';
    return this.state.selectedSystem==='Alpha' && !this.fleetTransitOf(fleet) && this.fleetSystemOf(fleet)==='Alpha';
  }
  systemFleetPanel(){
    const fleet=this.state.selectedFleet||'A1', f=this.fleetById(fleet);if(!f)return'';
    const recruiting=this.fleetHasRecruitment(fleet),eta=this.fleetRecruitmentTurns(fleet);
    const cards=this.shipCards(fleet)+this.recruitmentQueueCards(fleet);
    return `<div class="system-fleet-panel ${recruiting?'recruiting-fleet':''}"><div class="fleet-units"><div class="fleet-heading"><b>${f.name}</b><span>Squads ${this.fleetStackCount(fleet)} / ${FLEET_STACK_LIMIT}</span><span>Speed ${this.fleetSpeed(fleet)||'—'}</span>${recruiting?`<span class="forming-state">Forming · ${eta} rnd.</span>`:'<span>Ready to move</span>'}<span class="grow"></span><button class="button" data-action="recruit-open" data-fleet="${fleet}">Recruitment</button></div><div class="unit-row">${cards||'<div class="empty-fleet-note">Fleet is forming</div>'}</div></div></div>`;
  }
  battlePreview(){
    const enemy={corvette:60,frigate:40,cruiser:20};
    const ourFleet=this.fleetById('A1');
    const ours=(ourFleet?ourFleet.units:[]).reduce((acc,u)=>(acc[u.type]=(acc[u.type]||0)+u.count,acc),{});
    const side=(units,enemySide)=>`<div class="army ${enemySide?'enemy':''}"><b>${enemySide?'Fleet B':'Our 1st Fleet'}</b>${Object.entries(units).map(([t,c])=>`<div class="battle-unit"><img src="${SHIPS[t].img}">${SHIPS[t].name} · ${c}</div>`).join('')}</div>`;
    return `<div class="battle-overlay"><div class="battle-card"><div class="battle-head">Pre-battle · force estimate</div><div class="battle-body">${side(ours,false)}<div style="display:grid;place-items:center;font-weight:800">VS</div>${side(enemy,true)}</div><div class="battle-actions"><button class="button" data-action="battle-cancel">Cancel</button><button class="button primary" data-action="battle-confirm">Attack</button></div></div></div>`;
  }
  battleResult(){return `<div class="battle-overlay"><div class="battle-card"><div class="battle-result"><div class="result-title">Victory</div><div class="loss"><div class="army"><b>Our Fleet</b><p>Corvettes 72 → 51</p><p>Frigates 100 → 83</p><p>Cruisers 41 → 31</p><p>Battleships 8 → 6</p></div><div class="army enemy"><b>Fleet B</b><p>Corvettes 60 → 0</p><p>Frigates 40 → 0</p><p>Cruisers 20 → 0</p></div></div><p>Movement remaining: 2 / 7</p><button class="button primary" data-action="battle-close">Continue</button></div></div></div>`;}
  overlay(){return this.state.battle?this.battlePreview():this.state.battleResult?this.battleResult():'';}
  status(){return this.state.status?`<div class="status">${esc(this.state.status)}</div>`:'';}
  events(){return this.state.events.length?`<div class="event-stack">${this.state.events.map(x=>`<div class="toast"><b>Turn start</b>${esc(x)}</div>`).join('')}</div>`:'';}
  template(){return `<div class="app"><div class="topbar"><div class="top-flag">A</div><div class="brand">TOTAL SPACE · UX PROTOTYPE</div><div class="sep"></div><div class="stat">Round <b>${this.state.turn}</b></div><div class="stat treasury-stat" data-tooltip="Treasury · Current: ${this.state.treasury} · Income forecast: +420 · Fleet upkeep: −310 · After end turn: ${this.state.treasury+110}">Treasury <b>${this.state.treasury}</b> <span class="treasury-delta">(+110)</span></div><div class="grow"></div><button class="button primary" data-action="end-turn">End Turn</button></div><div class="workspace"><main class="main">${this.state.view==='galaxy'?this.galaxy():this.system()}</main></div><div id="ts-custom-tooltip" class="custom-tooltip"></div></div>`;}
  render(){return h('div',{style:{height:'100%'},onClick:this.onClick,onContextMenu:this.onContextMenu,onChange:this.onChange,onMouseOver:this.showTooltip,onMouseMove:this.moveTooltip,onMouseOut:this.hideTooltip,dangerouslySetInnerHTML:{__html:this.template()}});}
}
ReactDOM.render(h(App),document.getElementById('root'));
</script></body></html>
