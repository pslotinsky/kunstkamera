abs button{border:1px solid #465568;background:#202a35;border-radius:4px;padding:6px 8px;cursor:pointer;color:#b6c3d0}.tabs button.active{background:#294f6f;border-color:#76a8d2;color:#f2f8fc}.body{flex:1;min-height:0;padding:14px}.card{background:#18212b;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #0003}.btn{border:1px solid #516176;background:#273440;border-radius:4px;padding:8px 11px;cursor:pointer}.btn:hover{background:#30404f}.btn.primary{background:#29577e;border-color:#6499c7}.btn.danger{background:#64343b;border-color:#95525b}.btn:disabled{opacity:.45;cursor:default}.muted{color:var(--muted)}.small{font-size:11px}.tiny{font-size:10px}
/* shared fleet cards */
.fleet{padding:12px;overflow:auto}.fleet-head{display:flex;justify-content:space-between;margin-bottom:9px}.fleet-head b{font-size:12px}.roster{display:flex;gap:7px;flex-wrap:wrap}.u-card{width:104px;height:102px;background:#101820;border:1px solid #425164;border-radius:4px;padding:5px;position:relative}.u-card.enemy{border-color:#6b434a}.u-card img{width:100%;height:57px;object-fit:contain}.u-card.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}.u-card b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.u-card span{font-size:10px;color:#9aaabb}.loss{position:absolute;right:4px;top:4px;border-radius:8px;background:#68323a;color:#ffdce0;padding:2px 5px;font-size:9px}.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:11px;border-top:1px solid var(--line);padding-top:9px;margin-top:10px}
/* 1 */
.result-grid{height:100%;display:grid;grid-template-columns:1fr 270px 1fr;gap:12px}.resolve{padding:14px;text-align:center;display:flex;flex-direction:column;justify-content:center}.forecast{display:flex;height:8px;background:#6a343a;border-radius:6px;overflow:hidden;margin:14px 0}.forecast i{display:block;width:56%;background:#417aa7}.big{font-size:25px;font-weight:900;margin:8px 0}.win{color:#82c596}
/* battlefields */
.battlefield{position:relative;overflow:hidden;border:1px solid #3e4d5e;border-radius:6px;background:radial-gradient(circle at 50% 40%,#25394c,#15222e 40%,#0b1118 83%)}.battlefield:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#aab5bf 1px,transparent 1px);background-size:51px 51px;opacity:.12}.ship{position:absolute;width:96px;height:58px;display:grid;place-items:center;transition:left .35s,top .35s,transform .35s}.ship img{max-width:100%;max-height:100%;filter:drop-shadow(0 5px 6px #0008)}.ship.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75) drop-shadow(0 5px 6px #0008)}.ship .count{position:absolute;right:-6px;bottom:-4px;border:1px solid #506073;border-radius:9px;background:#0d141bdc;padding:2px 5px;font-size:9px}.ship.selected{outline:2px solid #83bdea;background:#2a587133;border-radius:5px}

.play-grid{height:100%;display:grid;grid-template-columns:235px 1fr 235px;gap:12px}.timeline{position:absolute;left:14px;right:14px;bottom:12px;height:43px;background:#101820e8;border:1px solid #415064;border-radius:5px;display:flex;align-items:center;padding:0 10px;gap:8px;z-index:8}.progress{height:5px;background:#354252;border-radius:5px;overflow:hidden;flex:1}.progress i{display:block;height:100%;width:0;background:#75afe0}.phasebar{position:absolute;left:12px;top:12px;display:flex;gap:5px;z-index:8}.phase{font-size:10px;color:#758697;border:1px solid #415062;background:#17212b;padding:4px 7px;border-radius:3px}.phase.active{background:#2a5574;border-color:#73a8d3;color:#f0f7fc}.flash{position:absolute;width:22px;height:22px;border-radius:50%;background:#f4c35b;box-shadow:0 0 28px #ef824f;opacity:0}.flash.on{opacity:1}

.deploy-grid{height:100%;display:grid;grid-template-columns:1fr 290px;gap:12px}.deploy-panel{padding:11px;display:flex;flex-direction:column;min-width:0}.deploy-panel h3{font-size:12px;margin:0 0 8px}.concept-note{font-size:11px;color:#91a2b2;margin:7px 0 0}.formation-board{flex:1;min-height:0;border:1px solid #405061;background:#101820;border-radius:5px;overflow:hidden;position:relative}

.formations{display:grid;grid-template-columns:1fr 92px 1fr;height:100%;align-items:center;padding:26px 36px;gap:14px}.formation{display:grid;grid-template-rows:repeat(5,64px);gap:8px}.form-slot{border:1px solid #425164;border-radius:4px;background:#151e27;display:flex;align-items:center;gap:10px;padding:6px 9px;cursor:pointer}.form-slot:hover{border-color:#6d8298}.form-slot.active{outline:2px solid #83bdea}.form-slot.enemy{border-color:#68444b}.form-slot img{width:66px;height:48px;object-fit:contain}.form-slot.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}.form-vs{text-align:center;font-size:18px;color:#8797a7}.form-slot .meta{font-size:10px;color:#93a4b5}

.echelons{height:100%;display:grid;grid-template-columns:repeat(6,1fr);position:relative}.echelon{border-right:1px solid #425163;position:relative;padding:26px 7px 8px;display:flex;flex-direction:column;gap:8px;align-items:center}.echelon:nth-child(3){border-right:3px solid #718293}.echelon:last-child{border-right:0}.echelon.ours{cursor:pointer}.echelon.ours:hover{background:#24425a2a}.ech-label{position:absolute;left:5px;top:5px;color:#697b8d;font-size:9px}.ech-unit{width:86px;height:54px;border:1px solid #405061;border-radius:4px;background:#141d26;padding:3px;display:grid;place-items:center;cursor:pointer}.ech-unit.selected{outline:2px solid #83bdea}.ech-unit img{max-width:100%;max-height:100%}.ech-unit.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}
/* v3 = one shared 1D axis */
.axis-wrap{height:100%;display:flex;align-items:center;padding:28px}.axis{position:relative;height:4px;background:#536275;width:100%;border-radius:4px}.axis:before{content:"";position:absolute;left:50%;top:-18px;height:40px;border-left:1px dashed #728191}.axis-pos{position:absolute;top:50%;width:78px;height:52px;transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer}.axis-pos img{max-width:100%;max-height:100%}.axis-pos.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}.axis-pos.selected{outline:2px solid #83bdea;border-radius:5px;background:#2a587133}.axis-tick{position:absolute;top:10px;width:1px;height:14px;background:#617184}.axis-distance{position:absolute;top:-32px;font-size:9px;color:#748697;transform:translateX(-50%)}

.hybrid{height:100%;display:grid;grid-template-rows:170px 1fr;gap:10px;padding:10px}.hybrid-slots{display:grid;grid-template-columns:1fr 78px 1fr;gap:12px;align-items:center}.slot-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.slot{height:65px;border:1px solid #425164;background:#151d26;border-radius:4px;display:grid;place-items:center;cursor:pointer}.slot:hover{border-color:#71869c}.slot img{max-width:68px;max-height:50px}.slot.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}.slot.selected{outline:2px solid #83bdea}.mini-cinema{position:relative;border:1px solid #3e4d5e;border-radius:5px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#26394a,#101822 75%)}.cinema-label{position:absolute;left:9px;top:8px;color:#8091a2;font-size:10px;z-index:5}
.side{padding:12px;display:flex;flex-direction:column;min-height:0}.side h3{font-size:12px;margin:0 0 8px}.notice{border:1px solid #3e4d5d;background:#111922;border-radius:4px;padding:8px;font-size:11px;color:#a7b7c6}.log{border-top:1px solid var(--line);padding-top:8px;margin-top:9px;font-size:10px;color:#99a9b8;min-height:55px}

.grid-layout{height:100%;display:grid;grid-template-columns:1fr 260px;gap:12px}.gridbox{padding:10px;display:flex;flex-direction:column}.tgrid{flex:1;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(6,1fr);border-left:1px solid #3e4d5e;border-top:1px solid #3e4d5e;background:#0f171f}.cell{position:relative;border-right:1px solid #3e4d5e;border-bottom:1px solid #3e4d5e;display:grid;place-items:center;cursor:pointer}.cell:hover{background:#243748}.cell.reach{background:#23466255}.cell.target{background:#65323b55}.cell.sel{outline:2px solid #83bdec;z-index:2}.cell img{max-width:78%;max-height:67%}.cell.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}.dual{height:100%;display:grid;grid-template-columns:1fr 70px 1fr;gap:14px;align-items:center;padding:14px}.matrix{height:410px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);border-left:1px solid #425164;border-top:1px solid #425164;background:#101820}.mcell{border-right:1px solid #425164;border-bottom:1px solid #425164;display:grid;place-items:center;cursor:pointer}.mcell:hover{background:#213344}.mcell.sel{outline:2px solid #83bdec}.mcell img{max-width:75%;max-height:65%}.mcell.enemy img{transform:scaleX(-1);filter:hue-rotate(135deg) saturate(.75)}

/* v4 — width-responsive layout */
.app{
  min-width:0 !important;
}
.shell{
  grid-template-columns:clamp(178px,17vw,238px) minmax(0,1fr) !important;
  min-width:0;
}
.stage,.view,.body,.head{
  min-width:0;
}
.body{
  overflow:auto;
}
.head{
  height:auto !important;
  min-height:70px;
  flex-wrap:wrap;
}
.tabs{
  max-width:100%;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tabs button{
  flex:0 0 auto;
  white-space:nowrap;
}
.result-grid{
  grid-template-columns:minmax(0,1fr) clamp(210px,22vw,270px) minmax(0,1fr);
}
.play-grid{
  grid-template-columns:clamp(175px,19vw,235px) minmax(0,1fr) clamp(175px,19vw,235px);
}
.deploy-grid{
  grid-template-columns:minmax(0,1fr) clamp(230px,25vw,290px);
}
.decision-grid{
  grid-template-columns:minmax(0,1fr) clamp(245px,27vw,305px);
}
.grid-layout{
  grid-template-columns:minmax(0,1fr) clamp(220px,23vw,260px);
}
.rts-grid{
  grid-template-columns:minmax(0,1fr) clamp(230px,25vw,280px);
}
.u-card{
  width:clamp(82px,8.6vw,104px);
}
.ship{
  width:clamp(70px,7.5vw,96px);
}
.formations{
  padding:clamp(12px,2vw,26px) clamp(14px,3vw,36px);
  grid-template-columns:minmax(0,1fr) clamp(54px,7vw,92px) minmax(0,1fr);
}
.form-slot{
  min-width:0;
}
.form-slot img{
  width:clamp(44px,5vw,66px);
}
.hybrid-slots{
  grid-template-columns:minmax(0,1fr) clamp(48px,6vw,78px) minmax(0,1fr);
}
.slot-row{
  min-width:0;
}
.axis-wrap{
  padding-inline:clamp(12px,3vw,28px);
}
.axis-pos{
  width:clamp(54px,6vw,78px);
}

/* Medium desktop / small laptop */
@media (max-width:1180px){
  .top{padding-inline:12px}
  .shell{grid-template-columns:188px minmax(0,1fr) !important}
  .nav button{padding:9px 9px;grid-template-columns:28px 1fr}
  .nav b{font-size:11px}
  .nav small{font-size:10px}
  .n{width:23px;height:23px}
  .body{padding:10px}
  .result-grid,.play-grid,.deploy-grid,.decision-grid,.grid-layout,.rts-grid{gap:9px}
  .fleet,.side{padding:9px}
  .roster{gap:5px}
  .u-card{width:82px;height:88px;padding:4px}
  .u-card img{height:47px}
  .u-card b,.u-card span{font-size:9px}
  .play-grid{grid-template-columns:170px minmax(0,1fr) 170px}
  .deploy-grid{grid-template-columns:minmax(0,1fr) 225px}
  .decision-grid{grid-template-columns:minmax(0,1fr) 245px}
  .grid-layout{grid-template-columns:minmax(0,1fr) 220px}
  .rts-grid{grid-template-columns:minmax(0,1fr) 225px}
  .formations{padding:14px}
  .formation{grid-template-rows:repeat(5,58px)}
  .form-slot{padding:4px 6px;gap:5px}
  .echelon{padding-inline:4px}
  .ech-unit{width:72px}
  .hybrid{grid-template-rows:148px 1fr}
}

/* Tablet / narrow browser: navigation becomes a horizontal concept strip */
@media (max-width:940px){
  body{overflow:hidden}
  .shell{
    grid-template-columns:1fr !important;
    grid-template-rows:auto minmax(0,1fr);
  }
  .nav{
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    border-right:0 !important;
    border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  .nav-title{display:none}
  .nav button{
    width:auto !important;
    min-width:142px;
    flex:0 0 142px;
    border-top:0 !important;
    border-right:1px solid #202a35;
    border-bottom:0 !important;
    padding:7px 9px;
  }
  .nav button.active{
    box-shadow:inset 0 -3px 0 var(--blue);
  }
  .nav small{display:none}
  .head{
    min-height:64px;
    padding:9px 12px;
  }
  .head h1{font-size:17px}
  .head p{font-size:11px}
  .body{padding:8px}
  .result-grid{
    grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);
  }
  .play-grid{
    grid-template-columns:150px minmax(0,1fr) 150px;
  }
  .deploy-grid{
    grid-template-columns:minmax(0,1fr) 205px;
  }
  .decision-grid{
    grid-template-columns:minmax(0,1fr) 220px;
  }
  .grid-layout,.rts-grid{
    grid-template-columns:minmax(0,1fr) 205px;
  }
  .u-card{width:72px;height:80px}
  .u-card img{height:40px}
  .fleet-head{font-size:10px}
  .ship{width:64px}
  .timeline{left:8px;right:8px;padding-inline:7px;gap:5px}
  .formations{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);padding:10px}
  .formation{grid-template-rows:repeat(5,52px);gap:5px}
  .form-slot{font-size:10px}
  .form-slot img{width:38px;height:38px}
  .echelon{gap:4px}
  .ech-unit{width:62px;height:47px}
  .axis-pos{width:52px}
  .hybrid{grid-template-rows:130px 1fr;padding:7px}
  .slot{height:54px}
}

/* Compact width: preserve battlefield size; panels move below instead of crushing it */
@media (max-width:720px){
  .top{height:46px;flex-basis:46px}
  .crumb,.top .badge{display:none}
  .brand{font-size:12px}
  .nav button{min-width:112px;flex-basis:112px;grid-template-columns:24px 1fr}
  .nav b{font-size:10px}
  .n{width:20px;height:20px;font-size:10px}

    display:block;
    padding:8px 10px;
  }

  .tabs{
    margin-top:7px;

  }
  .tabs button{padding:4px 7px;font-size:10px}

    overflow:auto;
    padding:7px;
  }

  }

  }
  .deploy-panel{
    min-height:480px;
  }
  .deploy-grid>.side,.decision-grid>.side,.grid-layout>.side,.rts-grid>.side{
    min-height:220px;
  }
  .formation-board{
    min-height:390px;
    overflow:auto;
  }
  .echelons{
    min-width:570px;
  }
  .hybrid{
    min-width:560px;
  }
  .axis-wrap{
    min-width:540px;
  }
  .tgrid{
    min-height:390px;
  }
  .dual-grid,.dual{
    min-width:520px;
  }
  .roster{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .u-card{
    flex:0 0 78px;
    width:78px;
  }
}

/* Phone-size fallback: keep concepts usable through horizontal scrolling inside the complex boards */
@media (max-width:480px){
  .nav button{min-width:100px;flex-basis:100px;padding-inline:6px}
  .head h1{font-size:14px}
  .body{padding:5px}
  .battlefield{min-height:340px}
  .deploy-panel{min-height:430px}
  .formation-board{
    overflow:auto;
  }
  .formations{
    min-width:450px;
  }
  .timeline .tiny{display:none}
  .timeline .btn{padding-inline:6px !important}
}


/* v5 — keep variant selectors visible at every width */
.head{
  flex:0 0 auto !important;
  height:auto !important;
  min-height:70px;
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"title variants";
  align-items:center !important;
  column-gap:14px;
  row-gap:8px;
  overflow:visible !important;
}
.head > div:first-child{
  grid-area:title;
  min-width:0;
}
.head > .grow{
  display:none !important;
}
.head > .tabs{
  grid-area:variants;
  align-self:center;
  justify-self:end;
  max-width:min(48vw,620px);
  overflow-x:auto;
  overflow-y:hidden;
  padding-bottom:2px;
  scrollbar-width:thin;
}
.head > .tabs button{
  flex:0 0 auto;
  white-space:nowrap;
}

/* On narrower screens, variants become an explicit second row instead of
   being squeezed or wrapping underneath the fixed-height header. */
@media (max-width:1180px){
  .head{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:
      "title"
      "variants";
    align-items:start !important;
  }
  .head > .tabs{
    justify-self:start;
    width:100%;
    max-width:100%;
  }
}

/* Preserve the same explicit variants row in tablet/phone modes. */
@media (max-width:940px){
  .head{
    display:grid !important;
    height:auto !important;
    flex-basis:auto !important;
  }
}
@media (max-width:720px){

function render(){if(timer&&S.concept!==2){clearInterval(timer);timer=null;S.playing=false} $('#root').innerHTML=`<div class="app"><div class="top"><div class="brand">TOTAL SPACE</div><div class="crumb">Battle concepts</div><div class="grow"></div><span class="badge">interactive wireframe</span></div><div class="shell"><aside class="nav"><div class="nav-title">From strategic to tactical</div>${concepts.map(c=>`<button data-concept="${c[0]}" class="${S.concept===c[0]?'active':''}"><span class="num">${c[0]}</span><span><b>${c[1]}</b><small>${c[2]}</small></span></button>`).join('')}</aside><main class="stage">${[null,c1,c2,c3,c4,c5,c6][S.concept]()}</main></div></div>`; bind()}
function bind(){ $$('[data-concept]').forEach(b=>b.onclick=()=>{S.concept=+b.dataset.concept;render()}); $$('[data-v3]').forEach(b=>b.onclick=()=>{S.v3=b.dataset.v3;S.deployRunning=false;S.deploySelected='p2';render()}); $$('[data-v4base]').forEach(b=>b.onclick=()=>{S.v4base=b.dataset.v4base;render()}); $$('[data-v5]').forEach(b=>b.onclick=()=>{S.v5=b.dataset.v5;render()}); $('[data-resolve]')?.addEventListener('click',()=>{S.resolved=!S.resolved;render()}); $('[data-play]')?.addEventListener('click',togglePlay); $('[data-skip]')?.addEventListener('click',()=>{S.playback=100;S.playing=false;if(timer){clearInterval(timer);timer=null}paintPlayback()}); $('[data-speed]')?.addEventListener('click',()=>{S.speed=S.speed===1?2:S.speed===2?4:1;$('[data-speed]').textContent='×'+S.speed}); $$('[data-form-slot]').forEach(s=>s.onclick=()=>formationClick(+s.dataset.formSlot)); $$('[data-ech-unit]').forEach(n=>n.onclick=()=>{S.deploySelected=n.dataset.echUnit;render()}); $$('[data-ech]').forEach(e=>e.onclick=()=>echelonClick(+e.dataset.ech)); $$('[data-axis]').forEach(n=>n.onclick=()=>{if(n.dataset.enemy!=='1'){S.deploySelected=n.dataset.axis;render()}}); $$('[data-axis-target]').forEach(t=>t.onclick=()=>axisMove(+t.dataset.axisTarget)); $$('[data-hslot]').forEach(s=>s.onclick=()=>hybridClick(+s.dataset.hslot)); $$('[data-dd-slot]').forEach(s=>s.onclick=()=>ddClick(s.dataset.side,+s.dataset.ddSlot)); $$('[data-queue]').forEach(s=>s.onclick=()=>{S.duelFocus=+s.dataset.queue;render()}); $$('[data-disc]').forEach(s=>s.onclick=()=>discClick(s.dataset.side,s.dataset.disc)); $('[data-start-auto]')?.addEventListener('click',()=>{S.deployRunning=true;render()}); $$('[data-choice]').forEach(c=>c.onclick=()=>{S.decision=c.dataset.choice;render()}); $('[data-next-round]')?.addEventListener('click',nextRound); $$('[data-cell]').forEach(c=>c.onclick=()=>gridClick(+c.dataset.cell)); $$('[data-mcell]').forEach(c=>c.onclick=()=>miniClick(+c.dataset.mcell,c.dataset.side)); $$('[data-rts]').forEach(n=>n.onclick=e=>{e.stopPropagation();rtsUnit(n.dataset.rts)}); $$('[data-cmd]').forEach(b=>b.onclick=()=>{S.rtsCommand=b.dataset.cmd;render()}); $('[data-rts-field]')?.addEventListener('click',rtsField); $('[data-pause]')?.addEventListener('click',()=>{S.rtsPaused=!S.rtsPaused;render()}); if(S.concept===2)paintPlayback() }
function c1(){return `<section class="view">${head('1 · Autoresolve','No battlefield. Two armies and the battle conditions immediately produce a strategic result and a list of losses.')}<div class="body"><div class="result-grid"><div class="card fleet"><div class="fleet-head"><b>1st Fleet · Player</b><span>2 340</span></div><div class="roster">${roster(false,S.resolved)}</div></div><div class="card resolve">${S.resolved?`<div class="muted small">Result</div><div class="big win">VICTORY</div><div class="kv"><span>Our losses</span><b>32</b><span>Enemy losses</span><b>47</b><span>Resolution rounds</span><b>5</b></div><button class="btn" data-resolve style="margin-top:16px">Reset</button>`:`<div class="muted small">Forecast</div><div class="forecast"><i></i></div><b>56% · 44%</b><button class="btn primary" data-resolve style="margin-top:18px">Resolve battle</button>`}</div><div class="card fleet"><div class="fleet-head"><b>Raider Fleet · Enemy</b><span>1 980</span></div><div class="roster">${roster(true,S.resolved)}</div></div></div></div></section>`}
function c2(){return `<section class="view">${head('2 · Autoresolve + playback','The result is already resolved as in option 1. Nothing done during playback can change the outcome — this is only a battle recording.')}<div class="body"><div class="play-grid"><div class="card fleet"><div class="fleet-head"><b>1st Fleet</b><span>2 340</span></div><div class="roster">${roster()}</div></div><div class="battlefield"><div class="phasebar"><span class="phase" data-phase="0">LONG</span><span class="phase" data-phase="1">MEDIUM</span><span class="phase" data-phase="2">CLOSE</span></div>${pbShip('a1','corvette',17,25,91,false)}${pbShip('a2','frigate',19,49,72,false)}${pbShip('a3','missile',17,70,38,false)}${pbShip('b1','frigate',83,25,82,true)}${pbShip('b2','cruiser',81,49,21,true)}${pbShip('b3','battleship',83,70,8,true)}<div class="flash" data-flash style="left:61%;top:42%"></div><div class="timeline"><button class="btn" data-play style="padding:5px 8px">${S.playing?'Ⅱ':'▶'}</button><span class="tiny" data-time>00:00</span><div class="progress"><i data-progress></i></div><span class="tiny">00:43</span><button class="btn" data-speed style="padding:5px 8px">×${S.speed}</button><button class="btn" data-skip style="padding:5px 8px">Skip</button></div></div><div class="card fleet"><div class="fleet-head"><b>Raider Fleet</b><span>1 980</span></div><div class="roster">${roster(true)}</div><div class="notice" style="margin-top:10px">The outcome is already fixed: player victory.</div></div></div></div></section>`}
function pbShip(id,t,x,y,q,e){return `<div class="ship ${e?'enemy':''}" data-pb="${id}" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)"><img src="${SHIPS[t]}"><span class="count">${q}</span></div>`}
function togglePlay(){S.playing=!S.playing;if(S.playing){if(!timer)timer=setInterval(()=>{S.playback=Math.min(100,S.playback+0.9*S.speed);paintPlayback();if(S.playback>=100){S.playing=false;clearInterval(timer);timer=null;$('[data-play]').textContent='▶'}},80);$('[data-play]').textContent='Ⅱ'}else{clearInterval(timer);timer=null;$('[data-play]').textContent='▶'}}
function paintPlayback(){if(S.concept!==2)return; const p=$('[data-progress]'); if(!p)return;p.style.width=S.playback+'%';$('[data-time]').textContent='00:'+String(Math.round(43*S.playback/100)).padStart(2,'0');const ph=S.playback<33?0:S.playback<70?1:2;$$('[data-phase]').forEach((x,i)=>x.classList.toggle('active',i===ph));const k=S.playback/100,pos={a1:[17+32*k,25+6*k],a2:[19+30*k,49],a3:[17+31*k,70-8*k],b1:[83-30*k,25+7*k],b2:[81-29*k,49],b3:[83-31*k,70-7*k]};for(const [id,v] of Object.entries(pos)){const n=$(`[data-pb="${id}"]`);n.style.left=v[0]+'%';n.style.top=v[1]+'%'}$('[data-flash]').classList.toggle('on',(S.playback>38&&S.playback<46)||(S.playback>72&&S.playback<79))}
function tabs3(attr='data-v3',val=S.v3){return `<div class="tabs">${[['v1','Formation'],['v2','Depth'],['v3','DD Positions'],['v4','1v1 Initiative']].map(x=>`<button ${attr}="${x[0]}" class="${val===x[0]?'active':''}">${x[0]} · ${x[1]}</button>`).join('')}</div>`}
function formationBoard(){return `<div class="formation-board formations"><div class="formation">${S.formation.map((t,i)=>formSlot(t,i,false)).join('')}</div><div class="form-vs">VS<br><span class="tiny">order<br>squads</span></div><div class="formation">${S.enemyFormation.map((t,i)=>formSlot(t,i,true)).join('')}</div></div>`}
function formSlot(t,i,e){return `<div class="form-slot ${e?'enemy':''} ${!e&&S.deploySelected==='f'+i?'active':''}" ${!e?`data-form-slot="${i}"`:''}>${t?`<img src="${SHIPS[t]}"><div><b>${N[t]}</b><div class="meta">Squad · position ${i+1}</div></div>`:`<span class="muted small">empty</span>`}</div>`}
function formationClick(i){const sid=S.deploySelected;if(!sid||!sid.startsWith('f')){S.deploySelected='f'+i;render();return}const j=+sid.slice(1);[S.formation[i],S.formation[j]]=[S.formation[j],S.formation[i]];S.deploySelected='f'+i;render()}
function echelonBoard(){
  const ours=[S.echelons[2].length?S.echelons[2]:['cruiser'],S.echelons[1].length?S.echelons[1]:['frigate','missile'],S.echelons[0].length?S.echelons[0]:['corvette']];
  const enemies=[S.echelons[5].length?S.echelons[5]:['frigate'],S.echelons[4].length?S.echelons[4]:['destroyer'],S.echelons[3].length?S.echelons[3]:['battleship']];
  const col=(ships,enemy=false,extra='')=>`<div class="depth-col ${extra}">${ships.map(t=>`<div class="depth-ship ${enemy?'enemy':''}"><img src="${SHIPS[t]}"></div>`).join('')}</div>`;
  return `<div class="formation-board depth-columns">${col(ours[0])}${col(ours[1])}${col(ours[2])}<div class="depth-divider"></div>${col(enemies[0],true,'enemy-first')}${col(enemies[1],true)}${col(enemies[2],true)}</div>`}
const DD_ATTACKS={corvette:{from:[1,2],to:[1,2]},frigate:{from:[1,2,3],to:[1,2,3]},missile:{from:[2,3,4],to:[2,3,4]},cruiser:{from:[1,2,3,4],to:[1,2,3]},destroyer:{from:[1,2,3],to:[1,2]},battleship:{from:[1,2],to:[1,2,3]}};
function ddBoard(){
  const selected=S.ddOur[S.ddSelected], rules=DD_ATTACKS[selected]||DD_ATTACKS.frigate;
  const ours=`<div class="dd-row2">${S.ddOur.map((t,i)=>`<div class="dd-slot3"><div class="dd-unit3 ${S.ddSelected===i?'sel':''}" data-dd-slot="${i}" data-side="our"><img src="${SHIPS[t]}"></div><div class="dd-posnum">${4-i}</div></div>`).join('')}</div>`;
  const enemy=`<div class="dd-row2">${S.ddEnemy.map((t,i)=>`<div class="dd-slot3"><div class="dd-unit3 enemy ${rules.to.includes(i+1)?'target':''}"><img src="${SHIPS[t]}"></div><div class="dd-posnum">${i+1}</div></div>`).join('')}</div>`;
  return `<div class="formation-board dd-lineup2">${ours}<div class="dd-gap2"></div>${enemy}</div>`}
function ddClick(side,i){if(side==='enemy')return;S.ddSelected=i;render()}
function duelBoard(){
  const q=S.duelQueue[S.duelFocus],pair=S.duelPairs[q.pair];
  const queue=`<div class="initiative-clean">${S.duelQueue.map((u,i)=>`<div class="init-clean ${u.side==='enemy'?'enemy':''} ${i===S.duelFocus?'current':''}"><b>${i+1}</b><img src="${SHIPS[u.t]}"></div>`).join('')}</div>`;
  return `<div class="formation-board duel-board-clean">${queue}<div class="duel-clean"><div class="duel-clean-ship"><img src="${SHIPS[pair.our.t]}"></div><div class="duel-clean-ship enemy"><img src="${SHIPS[pair.enemy.t]}"></div></div></div>`}
function boardBy(v){return v==='v1'?formationBoard():v==='v2'?echelonBoard():v==='v3'?ddBoard():duelBoard()}
function c3(){return `<section class="view">${head('3 · Semi-automatic battle','The player deploys forces before the battle. Below are four different models for how the battle itself can work.',tabs3())}<div class="body"><div class="deploy-grid"><div class="card deploy-panel"><h3>${S.v3} · ${['','Formation without field','Depth echelons','DD Positions','1v1 Initiative'][+S.v3.slice(1)]}</h3>${boardBy(S.v3)}</div><div class="card side"><h3>Fleet</h3><div class="roster">${roster(false)}</div></div></div></div></section>`}
function c4(){return `<section class="view">${head('4 · Semi-automatic battle + decisions','This is not a separate battlefield model: take any option from #3, but after each automatic round give the player one meaningful decision.',tabs3('data-v4base',S.v4base))}<div class="body"><div class="decision-grid"><div class="card deploy-panel"><div class="submode">Battle model: ${S.v4base}</div>${boardBy(S.v4base)}</div><div class="card side"><h3>Round ${S.round} complete</h3>${[['focus','Focus fire','Prioritize the selected enemy group.'],['range','Change distance','A general order for the next automatic round.'],['regroup','Regroup','Allow forces to be rearranged within the selected #3 model.']].map(x=>`<div class="choice ${S.decision===x[0]?'active':''}" data-choice="${x[0]}"><b>${x[1]}</b><span class="small muted">${x[2]}</span></div>`).join('')}<button class="btn primary" data-next-round style="margin-top:9px">Apply and resolve next round</button><div class="log">${S.log.slice(-4).reverse().map(x=>`<div>• ${x}</div>`).join('')}</div></div></div></div></section>`}
function nextRound(){const m={focus:'Focus fire: the priority target took additional losses.',range:'The Fleet changed distance before the next automatic exchange of fire.',regroup:'Formation adjusted before the next round.'}[S.decision];S.round++;S.log.push(m);render()}
function tabs5(){return `<div class="tabs">${[['v1','Shared 2D field'],['v2','Disciples 6 slots']].map(x=>`<button data-v5="${x[0]}" class="${S.v5===x[0]?'active':''}">${x[0]} · ${x[1]}</button>`).join('')}</div>`}
function discGrid(units,side){
  const occupied=new Set();for(const u of units){for(let k=0;k<u.size;k++)occupied.add(u.start+k)}
  const empties=[];for(let i=0;i<6;i++){if(!occupied.has(i)){const col=(i%2)+1,row=Math.floor(i/2)+1;empties.push(`<div class="form-cell" style="grid-column:${col};grid-row:${row}"></div>`)}}
  const rendered=units.map(u=>{const col=(u.start%2)+1,row=Math.floor(u.start/2)+1,sel=S.discSelected===side+'-'+u.id;return `<div class="form-unit ${side==='enemy'?'enemy':''} ${sel?'sel':''}" style="grid-column:${col} / span ${u.size};grid-row:${row}" data-disc="${u.id}" data-side="${side}"><img src="${SHIPS[u.t]}"></div>`}).join('');
  return `<div class="form6">${empties.join('')}${rendered}</div>`}
function c5(){let field;if(S.v5==='v1'){const cells=[];for(let i=0;i<60;i++){const o=S.grid[i];let cl='cell';if(i===S.gridSelected)cl+=' sel';if(o?.e)cl+=' enemy';if(S.gridSelected!==null&&!o&&dist(i,S.gridSelected)<=2)cl+=' reach';if(o?.e)cl+=' target';cells.push(`<div class="${cl}" data-cell="${i}">${o?`<img src="${SHIPS[o.t]}"><span class="tiny" style="position:absolute;right:3px;bottom:2px">${o.q}</span>`:''}</div>`)}field=`<div class="card gridbox"><div class="tgrid">${cells.join('')}</div></div>`}else{field=`<div class="card"><div class="disciples2">${discGrid(S.discOurs,'our')}<div class="form-vs-clean">VS</div>${discGrid(S.discEnemy,'enemy')}</div></div>`}const info=(S.discSelected||'our-o2').split('-');const pool=info[0]==='enemy'?S.discEnemy:S.discOurs;const unit=pool.find(u=>u.id===info[1])||pool[0];return `<section class="view">${head('5 · Turn-based battle','Here the player directly controls Squad actions.',tabs5())}<div class="body"><div class="grid-layout">${field}<div class="card side"><h3>Selected Squad</h3>${card(unit.t,qtyFor(unit.t),info[0]==='enemy')}<div class="kv"><span>Turn</span><b>ready</b><span>Size</span><b>${unit.size} cells</b></div></div></div></div></section>`}
function discClick(side,id){S.discSelected=side+'-'+id;render()}
function dist(a,b){return Math.abs(a%10-b%10)+Math.abs(Math.floor(a/10)-Math.floor(b/10))}
function gridClick(i){const o=S.grid[i];if(o&&!o.e){S.gridSelected=i;render();return}if(S.gridSelected==null)return;const from=S.grid[S.gridSelected];if(!from||from.e)return;if(!o&&dist(i,S.gridSelected)<=2){S.grid[i]=from;delete S.grid[S.gridSelected];S.gridSelected=i;render()}else if(o?.e){o.q=Math.max(0,o.q-8);if(!o.q)delete S.grid[i];render()}}
function miniClick(i,side){if(side==='our'){if(S.miniOurs[i]){S.miniSelected=i;render()}else if(S.miniOurs[S.miniSelected]){S.miniOurs[i]=S.miniOurs[S.miniSelected];S.miniOurs[S.miniSelected]='';S.miniSelected=i;render()}}else if(S.miniEnemy[i]&&S.miniSelected!=null){S.miniEnemy[i]='';render()}}
function c6(){return `<section class="view">${head('6 · Real-time with pause','Full tactical control: Squads exist in shared space, time runs continuously, and pause lets the player issue orders calmly — Total War-like direction.')}<div class="body"><div class="rts-grid"><div class="battlefield" data-rts-field><button class="pause-badge btn" data-pause>${S.rtsPaused?'Ⅱ  PAUSED':'▶  BATTLE RUNNING'}</button>${S.rts.map(u=>ship(u.t,u.x,u.y,u.q,u.e,u.id,S.rtsSelected.includes(u.id))).join('')}<div class="hint">Click friendly Squads to select. Move → click the field. Attack → click an enemy.</div></div><div class="card side"><h3>Selected: ${S.rtsSelected.length}</h3><div class="roster">${S.rts.filter(x=>S.rtsSelected.includes(x.id)).map(x=>card(x.t,x.q)).join('')||'<span class="muted small">Nothing</span>'}</div><button class="cmd ${S.rtsCommand==='move'?'active':''}" data-cmd="move">→ Move</button><button class="cmd ${S.rtsCommand==='attack'?'active':''}" data-cmd="attack">◎ Attack</button><button class="cmd ${S.rtsCommand==='hold'?'active':''}" data-cmd="hold">◇ Hold position</button><div class="notice" style="margin-top:10px">${S.rtsPaused?'Paused: time is stopped and orders can be given to several Squads.':'The battle runs in real time.'}</div></div></div></div></section>`}
function rtsUnit(id){const u=S.rts.find(x=>x.id===id);if(!u)return;if(u.e&&S.rtsCommand==='attack'&&S.rtsSelected.length){u.q=Math.max(0,u.q-6*S.rtsSelected.length);if(!u.q)S.rts=S.rts.filter(x=>x.id!==id);render();return}if(u.e)return;const i=S.rtsSelected.indexOf(id);if(i>=0)S.rtsSelected.splice(i,1);else S.rtsSelected.push(id);render()}
function rtsField(e){if(S.rtsCommand!=='move'||!S.rtsSelected.length)return;const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;S.rts.filter(u=>S.rtsSelected.includes(u.id)).forEach((u,i)=>{u.x=Math.max(6,Math.min(94,x+i*4));u.y=Math.max(10,Math.min(90,y+i*5))});render()}
render();
</script></body></html>
